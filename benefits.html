<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Benefits Writing Structural Practice</title>
    <style>
        :root {
            --primary-color: #10b981; /* Xanh lá Emerald đầy năng lượng tươi mới, tích cực */
            --dark-color: #064e3b;    /* Xanh lá đậm quý phái, cổ kính */
            --bg-color: #f0fdf4;      /* Nền xanh lá siêu nhạt, dịu mắt tuyệt đối */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng mảnh lá cây/hạt năng lượng xanh rơi nhẹ lãng mạn ở nền */
        .petal {
            position: absolute;
            background-color: #a7f3d0;
            border-radius: 4px;
            opacity: 0.5;
            pointer-events: none;
            animation: fade 6s infinite linear, float 6s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(35px) rotate(45deg); }
            100% { transform: translateX(0) rotate(90deg); }
        }

        /* Khung chứa giao diện chính trang nhã */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(6, 78, 59, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 2px solid #a7f3d0;
            z-index: 10;
            position: relative;
        }

        /* Icon biểu tượng lợi ích */
        .benefits-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: var(--dark-color); 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #f0fdf4; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.15s, border-color 0.15s; 
            font-weight: 500; 
            color: #047857;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #f0fdf4; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #065f46; 
            font-weight: bold;
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #065f46;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            font-weight: bold;
        }
        
        .btn-back:hover {
            color: var(--primary-color);
        }

        /* Khung chứa nút kết quả ở màn hình cuối */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #f0fdf4;
            border-color: #a7f3d0;
            color: #065f46;
        }

        .btn-next-topic:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--dark-color);
        }

        .btn-redo-wrong {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .btn-redo-wrong:hover {
            background-color: #ef4444;
            color: white;
            border-color: #991b1b;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="quiz-screen" class="main-box">
    <div class="benefits-icon">🌱✨</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">DẠNG BÀI WRITING: BENEFITS</div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text"></div>
    <button class="btn-back" onclick="goToMenu()">⬅ Quay lại Menu chính</button>
</div>

<div id="result-screen" class="main-box" style="display: none;">
    <div class="benefits-icon">🏅🍀</div>
    <h2>Kết Quả Luyện Tập</h2>
    <div class="question" id="result-summary"></div>
    
    <div class="result-buttons">
        <button class="btn-result btn-next-topic" onclick="goToMenu()">🔄 Đổi sang cấu trúc khác</button>
        <button class="btn-result btn-redo-wrong" id="btn-redo" onclick="startRedoWrong()">🔥 Làm lại các câu sai</button>
    </div>
</div>

<script>
    // DATA TOÀN BỘ CẤU TRÚC NGỮ PHÁP & TỪ NỐI DẠNG BÀI BENEFITS
    const vocabularyData = [
        { word: "[Topic] brings many great benefits to our modern lives.", mean: "[Tên chủ đề] mang lại nhiều lợi ích tuyệt vời cho cuộc sống hiện đại của chúng ta." },
        { word: "There are many positive effects of [Topic] on our society.", mean: "Có nhiều ảnh hưởng tích cực của [chủ đề] đối với xã hội chúng ta." },
        { word: "Using / Doing [Topic] is very useful and important for everyone.", mean: "Việc sử dụng / làm [chủ đề] thì rất hữu ích và quan trọng cho mọi người." },
        { word: "First of all, it brings a lot of advantages.", mean: "Trước hết, nó mang lại rất nhiều điểm tốt." },
        { word: "To begin with, we cannot deny its useful values.", mean: "Đầu tiên, chúng ta không thể phủ nhận những giá trị hữu ích của nó." },
        { word: "In conclusion, [Topic] is very helpful, and we should use it effectively in our daily life.", mean: "Kết luận lại, [chủ đề] rất có ích, và chúng ta nên sử dụng nó một cách hiệu quả trong cuộc sống hàng ngày." },
        { word: "All in all, because of these great benefits, I believe that [Topic] plays an important role in our world.", mean: "Tóm lại, vì những lợi ích tuyệt vời này, tôi tin rằng [chủ đề] đóng một vai trò quan trọng trong thế giới của chúng ta." },
        { word: "Keeping + N + V (E.g: Keeping pets brings...)", mean: "Cấu trúc: Việc nuôi/giữ cái gì đó làm gì (Ví dụ: Việc nuôi thú cưng mang lại...)" },
        { word: "bring + N (E.g: brings many great benefits)", mean: "Cấu trúc: Mang lại cái gì đó (Ví dụ: mang lại nhiều lợi ích lớn)" },
        { word: "cannot deny + N / that + Clause", mean: "Cấu trúc: Không thể phủ nhận điều gì / không thể phủ nhận rằng..." },
        { word: "help + sb + V (E.g: helps people do more exercise)", mean: "Cấu trúc: Giúp ai đó làm gì (Ví dụ: giúp mọi người vận động nhiều hơn)" },
        { word: "If + S + V, S + V", mean: "Cấu trúc câu điều kiện loại 1: Nếu... thì..." },
        { word: "need to + V (E.g: need to walk it)", mean: "Cấu trúc: Cần phải làm gì (Ví dụ: cần phải dắt nó đi dạo)" },
        { word: "can + V (E.g: Pets can improve our mood)", mean: "Cấu trúc: Có thể làm gì (Ví dụ: Thú cưng có thể cải thiện tâm trạng)" },
        { word: "a good way to + V (E.g: is a good way to reduce stress)", mean: "Cấu trúc: Một cách tốt để làm gì (Ví dụ: là một cách tốt để giảm căng thẳng)" },
        { word: "such as + N (E.g: such as cats or dogs / solar energy)", mean: "Cấu trúc dùng liệt kê: Chẳng hạn như / Như là..." },
        { word: "be good for + N (E.g: is very good for families)", mean: "Cấu trúc: Tốt cho cái gì/ai đó (Ví dụ: rất tốt cho các gia đình)" },
        { word: "teach + sb + to V / how to + V", mean: "Cấu trúc: Dạy ai đó làm gì / cách làm một việc gì đó" },
        { word: "care for + N/sb (E.g: care for others)", mean: "Cấu trúc cụm động từ: Quan tâm / Chăm sóc ai đó" },
        { word: "make + O + Adj (E.g: Pets make our homes safer)", mean: "Cấu trúc: Làm cho ai/cái gì trở nên như thế nào (Ví dụ: Thú cưng làm nhà ta an toàn hơn)" },
        { word: "because + Clause", mean: "Cấu trúc liên từ: Bởi vì + một mệnh đề hoàn chỉnh" },
        { word: "should + V (E.g: We should treat them like...)", mean: "Cấu trúc diễn đạt lời khuyên: Nên làm gì" },
        { word: "treat + O + like + N", mean: "Cấu trúc: Đối xử với ai/cái gì như là..." },
        { word: "First of all,", mean: "Từ nối: Trước hết, / Đầu tiên là," },
        { word: "For example,", mean: "Từ nối dẫn chứng: Ví dụ như," },
        { word: "Furthermore,", mean: "Từ nối thêm thông tin: Hơn nữa, / Vả lại," },
        { word: "In addition,", mean: "Từ nối bổ sung: Ngoài ra, / Thêm vào đó," },
        { word: "Last but not least,", mean: "Từ nối: Cuối cùng nhưng không kém phần quan trọng," },
        { word: "In conclusion,", mean: "Từ nối kết đoạn: Kết luận lại," },
        { word: "As a result, + Clause", mean: "Từ nối hệ quả: Kết quả là, + mệnh đề" },
        { word: "for future generations", mean: "Cụm danh từ cố định: Cho các thế hệ tương lai" },
        { word: "come from + N", mean: "Cụm động từ: Đến từ / Có nguồn gốc từ..." },
        { word: "can be + V3/ed (E.g: can be used again)", mean: "Cấu trúc bị động với động từ khuyết thiếu: Có thể được làm gì" },
        { word: "I believe that + Clause", mean: "Cấu trúc bày tỏ quan điểm: Tôi tin rằng + mệnh đề" },
        { word: "Doing + N/V-ing + V (E.g: Doing exercise regularly brings...)", mean: "Danh động từ làm chủ ngữ: Việc làm gì đó (Ví dụ: Việc tập thể dục đều đặn mang lại...)" },
        { word: "stay + adj (E.g: stay healthy and strong)", mean: "Cấu trúc hệ từ: Duy trì trạng thái nào đó (Ví dụ: giữ khỏe mạnh và cường tráng)" },
        { word: "People who + V (E.g: People who exercise regularly)", mean: "Mệnh đề quan hệ: Những người mà làm việc gì đó..." },
        { word: "be less likely to + V", mean: "Cấu trúc so sánh/khả năng: Ít có khả năng làm gì hơn" },
        { word: "which + V (E.g: , which helps people feel refreshed)", mean: "Mệnh đề quan hệ thay thế cho cả ý phía trước: Điều mà/Điều này giúp..." },
        { word: "live + a/an + adj + N (E.g: live a more active lifestyle)", mean: "Cấu trúc: Sống một lối sống như thế nào đó" },
        { word: "the amount of + N không đếm được", mean: "Cấu trúc định lượng: Lượng cái gì đó (Ví dụ: lượng rác thải)" },
        { word: "become + adj (E.g: becomes cleaner and healthier)", mean: "Cấu trúc hệ từ: Trở nên như thế nào đó" },
        { word: "Instead of + N/V-ing", mean: "Cấu trúc giới từ: Thay vì cái gì / Thay vì làm gì" },
        { word: "encourage + sb + to V", mean: "Cấu trúc: Khuyến khích/động viên ai đó làm gì" }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isRedoMode = false;

    // Bộ phát âm thanh phần cứng chuẩn xác chống crash trang
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'correct' ? 950 : 850, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                osc.start(); osc.stop(ctx.currentTime + 0.18);
            }
        } catch(e) {}
    }

    // Hiệu ứng hạt lá cây rơi phông nền dịu mắt
    function createPetals() {
        try {
            const container = document.getElementById('petal-container');
            if (!container) return;
            for (let i = 0; i < 10; i++) {
                let petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                let size = Math.random() * 8 + 6 + 'px';
                petal.style.width = size;
                petal.style.height = Math.random() * 4 + 8 + 'px';
                petal.style.animationDelay = Math.random() * 5 + 's';
                petal.style.animationDuration = Math.random() * 3 + 4 + 's';
                container.appendChild(petal);
            }
        } catch(e) {}
    }

    function initQuiz() {
        try {
            currentQuestions = [...vocabularyData].sort(() => Math.random() - 0.5);
            wrongQuestions = [];
            currentQuestionIndex = 0;
            score = 0;
            isRedoMode = false;
            showQuestion();
        } catch(e) {
            alert("Đã xảy ra lỗi khởi tạo dữ liệu bài học.");
        }
    }

    function showQuestion() {
        if (currentQuestions.length === 0 || !currentQuestions[currentQuestionIndex]) return;

        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Cấu trúc/Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentQuestions.length} | Đúng: ${score}`;

        let options = [q.word];
        let allWords = vocabularyData.map(item => item.word).filter(w => w !== q.word);
        allWords.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 3; i++) {
            if (allWords[i]) options.push(allWords[i]);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHTML = "";
        options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}', this)">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        let q = currentQuestions[currentQuestionIndex];

        if (selected === correct) {
            playSound('correct');
            btn.style.backgroundColor = '#ecfdf5';
            btn.style.borderColor = '#34d399';
            if (!isRedoMode) score++;
        } else {
            playSound('wrong');
            btn.style.backgroundColor = '#fef2f2';
            btn.style.borderColor = '#fca5a5';
            if (!wrongQuestions.some(item => item.word === q.word)) {
                wrongQuestions.push(q);
            }
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 700);
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let summaryText = "";
        if (isRedoMode) {
            summaryText = `Vòng ôn tập hoàn tất! Bạn còn <b>${wrongQuestions.length}</b> cấu trúc chưa nắm vững hoàn toàn.`;
        } else {
            // ĐỒNG BỘ ĐA BIẾN SANG FILE LICH_SU.HTML TRÁNH LỖI UNDEFINED
            saveToLearningHistory(score, currentQuestions.length);
            summaryText = `Kết quả tuyệt vời! Bạn trả lời chính xác <b>${score}/${currentQuestions.length}</b> cấu trúc bài viết Benefits.`;
        }
        document.getElementById('result-summary').innerHTML = summaryText;

        let redoBtn = document.getElementById('btn-redo');
        if (wrongQuestions.length === 0) {
            redoBtn.style.display = 'none';
            document.getElementById('result-summary').innerHTML += "<br><span style='color: #059669; font-weight: bold; font-size: 15px;'>🥇 Hoàn hảo! Bạn đã làm chủ 100% cấu trúc dạng bài viết Benefits! 🌿🚀</span>";
        } else {
            redoBtn.style.display = 'block';
            redoBtn.innerText = `🔥 Làm lại ${wrongQuestions.length} câu sai`;
        }
    }

    function startRedoWrong() {
        playSound('click');
        currentQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        isRedoMode = true;

        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function goToMenu() {
        playSound('click');
        window.location.href = 'reading.html';
    }

    // HÀM LIÊN KẾT NHẬT KÝ ĐỒNG BỘ ĐA BIẾN AN TOÀN
    function saveToLearningHistory(finalScore, totalQuestions) {
        try {
            let history = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let now = new Date();
            
            let dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            
            // Đóng gói dữ liệu mảng kép linh hoạt phòng ngừa lỗi undefined
            history.unshift({
                date: dateStr,
                thoiGian: dateStr,
                skill: 'Writing',
                kyNang: 'Writing',
                topic: 'Benefits Structure',
                chuDe: 'Benefits Structure',
                type: 'Trắc nghiệm cấu trúc bài',
                capDo: 'Trắc nghiệm cấu trúc bài',
                score: finalScore,
                total: totalQuestions,
                diemSo: `${finalScore}/${totalQuestions}`
            });
            
            if (history.length > 50) history.pop();
            localStorage.setItem('vstep_learning_history', JSON.stringify(history));
        } catch(e) {
            console.log("Không thể truy cập localStorage");
        }
    }

    window.onload = function() {
        createPetals();
        initQuiz();
    };
</script>

</body>
</html>
