<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP Writing B1 - Benefits Paragraphs</title>
    <style>
        :root {
            --primary-color: #0284c7; /* Màu xanh chủ đạo chuẩn VSTEP Writing */
            --dark-color: #1e293b;
            --bg-color: #f8fafc;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--dark-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .btn-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 25px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            padding: 0;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #0f172a;
        }

        /* MÀN HÌNH 1: DANH SÁCH CHỦ ĐỀ */
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .topic-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .topic-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
            transform: translateY(-1px);
        }

        .topic-card-left h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #0f172a;
        }

        .topic-card-left p {
            margin: 0 0 8px 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .topic-badges {
            display: flex;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-lvl1 { color: #eab308; }
        .badge-lvl2 { color: #10b981; }

        .arrow-right {
            font-size: 20px;
            color: #94a3b8;
            font-weight: bold;
        }

        /* MÀN HÌNH 2: CHI TIẾT CHỦ ĐỀ */
        .header-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-learning {
            background-color: #64748b;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .prompt-container {
            border-left: 4px solid var(--primary-color);
            background-color: #f0f9ff;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Hệ thống Tabs lớn */
        .main-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }

        .tab-btn.active {
            background: white;
            color: #0f172a;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        /* Hệ thống Tabs nhỏ phụ */
        .sub-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .sub-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 6px;
        }

        .sub-btn.active {
            color: var(--primary-color);
            background-color: #f0f9ff;
        }

        /* Nội dung hiển thị */
        .panel-content {
            line-height: 1.7;
            font-size: 15px;
        }

        .structure-section {
            margin-bottom: 20px;
        }

        .structure-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 16px;
        }

        .text-en {
            font-weight: 600;
            color: #0f172a;
        }

        .text-vi {
            color: #64748b;
            font-style: italic;
            margin-bottom: 12px;
        }

        .essay-display {
            font-family: 'Georgia', serif;
            font-size: 16px;
            text-align: justify;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            white-space: pre-line;
        }

        /* Giao diện bài tập thực hành */
        .exercise-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .exercise-item {
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .exercise-text {
            font-size: 16px;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .input-blank {
            border: none;
            border-bottom: 2px solid #cbd5e1;
            background: transparent;
            padding: 2px 8px;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            text-align: center;
            outline: none;
            width: 150px;
        }

        .input-blank:focus {
            border-color: var(--primary-color);
        }

        .feedback {
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
        }

        .feedback.correct { color: var(--success-color); }
        .feedback.wrong { color: #ef4444; }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            align-self: flex-start;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- MÀN HÌNH 1: DANH SÁCH CHỦ ĐỀ CHỌN LỰA -->
    <div id="view-menu">
        <button class="btn-link" onclick="window.location.href='writing.html'">← Quay lại Menu Writing</button>
        <div class="page-title">Select a Benefits Topic</div>
        <div class="topic-list" id="topic-list-render"></div>
    </div>

    <!-- MÀN HÌNH 2: GIAO DIỆN HỌC CHI TIẾT TỪNG TAB -->
    <div id="view-detail" style="display: none;">
        <div class="header-detail">
            <button class="btn-link" onclick="showMenuScreen()">← Chọn Chủ Đề Khác</button>
            <div class="status-learning">Đang Học Lý Thuyết</div>
        </div>

        <div class="prompt-container" id="prompt-text"></div>

        <!-- 3 TAB LỚN HỆ THỐNG -->
        <div class="main-tabs">
            <button class="tab-btn active" id="mtab-0" onclick="changeMainTab(0)">1. Cấu trúc, Từ nối & Bài mẫu</button>
            <button class="tab-btn" id="mtab-1" onclick="changeMainTab(1)">2. Cấp độ 1</button>
            <button class="tab-btn" id="mtab-2" onclick="changeMainTab(2)">3. Cấp độ 2</button>
        </div>

        <!-- 3 TAB NHỎ PHỤ THUỘC LÝ THUYẾT -->
        <div class="sub-tabs" id="wrap-sub-tabs">
            <button class="sub-btn active" id="stab-0" onclick="changeSubTab(0)">📐 1. Cấu trúc</button>
            <button class="sub-btn" id="stab-1" onclick="changeSubTab(1)">🔗 2. Từ nối</button>
            <button class="sub-btn" id="stab-2" onclick="changeSubTab(2)">📝 3. Thực hành bài mẫu</button>
        </div>

        <!-- KHUNG CHỨA NỘI DUNG TẢI ĐỘNG -->
        <div class="panel-content" id="panel-body"></div>
    </div>

</div>

<script>
    // DỮ LIỆU ĐẦY ĐỦ CẤU TRÚC CHUNG, 4 BÀI MẪU VÀ BẢNG NGỮ PHÁP DỊCH NGHĨA VIỆT 100%
    const generalStructure = {
        intro: [
            { en: "[Tên chủ đề] brings many great benefits to our modern lives.", vi: "(... mang lại nhiều lợi ích tuyệt vời cho cuộc sống hiện đại của chúng ta.)" },
            { en: "There are many positive effects of [Tên chủ đề] on our society.", vi: "(Có nhiều ảnh hưởng tích cực của ... đối với xã hội chúng ta.)" },
            { en: "Using / Doing [Tên chủ đề] is very useful and important for everyone.", vi: "(Việc sử dụng / làm ... thì rất hữu ích và quan trọng cho mọi người.)" }
        ],
        body: [
            { en: "First of all, it brings a lot of advantages.", vi: "(Trước hết, nó mang lại rất nhiều điểm tốt.)" },
            { en: "To begin with, we cannot deny its useful values.", vi: "(Đầu tiên, chúng ta không thể phủ nhận những giá trị hữu ích của nó.)" }
        ],
        conclusion: [
            { en: "In conclusion, [Tên chủ đề] is very helpful, and we should use it effectively in our daily life.", vi: "(Kết luận lại, ... rất có ích, và chúng ta nên sử dụng nó một cách hiệu quả trong cuộc sống hàng ngày.)" },
            { en: "All in all, because of these great benefits, I believe that [Tên chủ đề] plays an important role in our world.", vi: "(Tóm lại, vì những lợi ích tuyệt vời này, tôi tin rằng ... đóng một vai trò quan trọng trong thế giới của chúng ta.)" }
        ]
    };

    const topicsData = [
        {
            title: "Public Transport",
            desc: "Discuss the benefits of using public transport in modern cities.",
            prompt: "Many people choose to travel by public transport. Write a paragraph (120-150 words) about the benefits of public transport.",
            essay: "Public transport brings many great benefits to our modern lives. First of all, we cannot deny its useful values for the environment. Using buses or trains helps reduce air pollution because it cuts down the amount of private vehicles. Furthermore, public transport is a very affordable choice. For example, the ticket fare is usually cheap, which helps people save a lot of money every month. In addition, using public transport helps minimize traffic jams during rush hours. Instead of driving in gridlock, citizens can relax or read books on board. Last but not least, it reduces the stress of driving and looking for a parking space. In conclusion, public transport is very helpful, and we should use it effectively in our daily life.",
            grammar: [
                { en: "Public transport brings many great benefits to our modern lives.", vi: "Giao thông công cộng mang lại nhiều lợi ích lớn cho cuộc sống hiện đại." },
                { en: "Using buses or trains helps reduce air pollution...", vi: "Sử dụng xe buýt hoặc tàu hoả giúp giảm thiểu ô nhiễm không khí..." },
                { en: "Instead of driving in gridlock, citizens can relax...", vi: "Thay vì lái xe lúc giao thông tê liệt, người dân có thể thư giãn..." }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "Public transport _______ many great benefits to our modern lives.", ans: "brings" },
                { text: "Using buses or trains _______ reduce air pollution.", ans: "helps" },
                { text: "Citizens can relax or read books on _______.", ans: "board" }
            ],
            lvl2: [
                { text: "_______, we cannot deny its useful values for the environment.", ans: "First of all" },
                { text: "_______, public transport is a very affordable choice.", ans: "Furthermore" },
                { text: "_______, public transport is very helpful, and we should use it effectively.", ans: "In conclusion" }
            ]
        },
        {
            title: "Keeping Pets",
            desc: "Discuss the benefits of keeping pets for health and family.",
            prompt: "Many people enjoy keeping pets at home. Write a paragraph (120–150 words) about the benefits of keeping pets.",
            essay: "Keeping pets brings many great benefits to our modern lives. First of all, we cannot deny its useful values for our health. Having a pet helps people do more exercise. For example, if you have a dog, you need to walk it in the park every day. Furthermore, pets are excellent friends that can improve our mood. After a hard-working day, playing with popular pets such as cats or dogs is a good way to reduce stress. In addition, keeping pets is very good for families with children. It teaches children how to love animals and care for others. Last but not least, pets make our homes safer because dogs can guard the house. In conclusion, keeping a pet is very helpful, and we should treat them like a member of our family.",
            grammar: [
                { en: "Keeping + N + V", vi: "Keeping pets brings many great benefits to our modern lives. (Việc nuôi thú cưng mang lại nhiều lợi ích cho cuộc sống hiện đại.)" },
                { en: "bring + N", vi: "brings many great benefits (mang lại nhiều lợi ích lớn.)" },
                { en: "cannot deny + N / that + mệnh đề", vi: "We cannot deny its useful values for our health. (Chúng ta không thể phủ nhận những giá trị hữu ích của nó đối với sức khỏe.)" },
                { en: "help + sb + V", vi: "Having a pet helps people do more exercise. (Việc nuôi thú cưng giúp mọi người vận động nhiều hơn.)" },
                { en: "If + S + V, S + V", vi: "If you have a dog, you need to walk it every day. (Nếu bạn có một chú chó, bạn cần dắt nó đi dạo mỗi ngày.)" },
                { en: "need to + V", vi: "need to walk it (cần phải dắt nó đi dạo.)" },
                { en: "can + V", vi: "Pets can improve our mood. (Thú cưng có thể cải thiện tâm trạng của chúng ta.)" },
                { en: "a good way to + V", vi: "is a good way to reduce stress. (là một cách tốt để giảm căng thẳng.)" },
                { en: "such as + N", vi: "such as cats or dogs (chẳng hạn như mèo hoặc chó.)" },
                { en: "be good for + N", vi: "Keeping pets is very good for families with children. (Việc nuôi thú cưng rất tốt cho các gia đình có trẻ em.)" },
                { en: "teach + sb + to V", vi: "It teaches children to love animals. (Nó dạy trẻ em yêu quý động vật.)" },
                { en: "how to + V", vi: "how to love animals and care for others (cách yêu quý động vật và quan tâm đến người khác.)" },
                { en: "care for + N/sb", vi: "care for others (quan tâm/chăm sóc người khác.)" },
                { en: "make + O + Adj", vi: "Pets make our homes safer. (Thú cưng làm cho ngôi nhà của chúng ta an toàn hơn.)" },
                { en: "because + mệnh đề", vi: "because dogs can guard the house. (bởi vì chó có thể trông nhà.)" },
                { en: "should + V", vi: "We should treat them like a member of our family. (Chúng ta nên đối xử với chúng như một thành viên trong gia đình.)" },
                { en: "treat + O + like + N", vi: "treat them like a member of our family (đối xử với chúng như một thành viên trong gia đình.)" }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "For example,", vi: "Ví dụ," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "Having a pet _______ people do more exercise.", ans: "helps" },
                { text: "After a hard-working day, playing with pets is a good way to _______ stress.", ans: "reduce" },
                { text: "Pets make our homes _______ because dogs can guard the house.", ans: "safer" }
            ],
            lvl2: [
                { text: "_______, we cannot deny its useful values for our health.", ans: "First of all" },
                { text: "_______, pets are excellent friends that can improve our mood.", ans: "Furthermore" },
                { text: "_______, keeping a pet is very helpful, and we should treat them like a member.", ans: "In conclusion" }
            ]
        },
        {
            title: "Renewable Energy",
            desc: "Discuss how clean energy sources protect the environment.",
            prompt: "Renewable energy is becoming more popular in many countries. Write a paragraph (120–150 words) about the benefits of renewable energy.",
            essay: "Renewable energy brings many benefits to our lives and the environment. First of all, it helps reduce air pollution. Sources of renewable energy such as solar energy and wind energy do not produce harmful gases. As a result, the air becomes cleaner and healthier for people. Furthermore, renewable energy can reduce the use of fossil fuels such as coal and oil. This helps protect natural resources for future generations. In addition, renewable energy is sustainable because it comes from natural sources that can be used again and again. Last but not least, using renewable energy can create new jobs in many areas. More people can find work in the energy industry and improve their lives. In conclusion, renewable energy has many advantages, and I believe that it is important for a cleaner and better future.",
            grammar: [
                { en: "bring + N", vi: "Renewable energy brings many benefits... (Năng lượng tái tạo mang lại nhiều lợi ích...)" },
                { en: "help + V", vi: "It helps reduce air pollution. (Nó giúp giảm thiểu ô nhiễm không khí.)" },
                { en: "such as + N", vi: "such as solar energy and wind energy. (chẳng hạn như năng lượng mặt trời và năng lượng gió.)" },
                { en: "do not + V", vi: "do not produce harmful gases. (không sản sinh ra khí độc hại.)" },
                { en: "As a result, + mệnh đề", vi: "As a result, the air becomes cleaner. (Kết quả là, không khí trở nên sạch hơn.)" },
                { en: "can + V", vi: "Renewable energy can reduce... (Năng lượng tái tạo có thể giảm bớt...)" },
                { en: "help + V", vi: "This helps protect natural resources. (Điều này giúp bảo vệ tài nguyên thiên nhiên.)" },
                { en: "for + future generations", vi: "for future generations. (cho các thế hệ tương lai.)" },
                { en: "be + adj + because + mệnh đề", vi: "Renewable energy is sustainable because... (Năng lượng tái tạo thì bền vững bởi vì...)" },
                { en: "come from + N", vi: "comes from natural sources. (đến từ các nguồn tự nhiên.)" },
                { en: "can be + V3/ed", vi: "can be used again and again. (có thể được sử dụng đi sử dụng lại.)" },
                { en: "create + N", vi: "create new jobs. (tạo ra những công việc mới.)" },
                { en: "find + N", vi: "find work. (tìm kiếm việc làm.)" },
                { en: "improve + N", vi: "improve their lives. (cải thiện cuộc sống của họ.)" },
                { en: "I believe that + mệnh đề", vi: "I believe that it is important... (Tôi tin rằng điều đó rất quan trọng...)" }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "As a result,", vi: "Kết quả là," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "Sources of renewable energy do not _______ harmful gases.", ans: "produce" },
                { text: "This helps _______ natural resources for future generations.", ans: "protect" },
                { text: "Renewable energy is _______ because it comes from natural sources.", ans: "sustainable" }
            ],
            lvl2: [
                { text: "_______, it helps reduce air pollution.", ans: "First of all" },
                { text: "_______, the air becomes cleaner and healthier for people.", ans: "As a result" },
                { text: "_______, renewable energy has many advantages, and I believe it is important.", ans: "In conclusion" }
            ]
        },
        {
            title: "Regular Exercise",
            desc: "Discuss the positive effects of working out regularly.",
            prompt: "Many people think that regular exercise is important for a healthy life. Write a paragraph (120–150 words) about the benefits of doing exercise regularly.",
            essay: "Doing exercise regularly brings many benefits to our health and daily life. First of all, it helps people stay healthy and strong. People who exercise regularly are less likely to get sick and often have more energy for work and study. Furthermore, exercise is a good way to reduce stress and improve mood. After a busy day, activities such as walking, jogging, or cycling can help people relax and feel happier. In addition, regular exercise can improve sleep quality, which helps people feel refreshed in the morning. Last but not least, doing exercise helps people maintain a healthy weight and live a more active lifestyle. In conclusion, regular exercise has many advantages, and I believe that everyone should make it a part of their daily routine.",
            grammar: [
                { en: "Doing + N/V-ing + V", vi: "Doing exercise regularly brings many benefits... (Việc tập thể dục thường xuyên mang lại nhiều lợi ích...)" },
                { en: "bring + N", vi: "brings many benefits (mang lại nhiều lợi ích)" },
                { en: "help + sb + V", vi: "It helps people stay healthy and strong. (Nó giúp mọi người khỏe mạnh và cường tráng.)" },
                { en: "stay + adj", vi: "stay healthy and strong (duy trì trạng thái khỏe mạnh và cường tráng.)" },
                { en: "People who + V", vi: "People who exercise regularly... (Những người tập thể dục thường xuyên...)" },
                { en: "be less likely to + V", vi: "are less likely to get sick (ít có khả năng bị bệnh hơn.)" },
                { en: "have + N", vi: "have more energy (có nhiều năng lượng hơn.)" },
                { en: "be a good way to + V", vi: "Exercise is a good way to reduce stress. (Tập thể dục là một cách tốt để giảm căng thẳng.)" },
                { en: "reduce + N", vi: "reduce stress (giảm căng thẳng.)" },
                { en: "improve + N", vi: "improve mood (cải thiện tâm trạng.)" },

                { en: "which + V", vi: "which helps people feel refreshed (điều này giúp mọi người cảm thấy tỉnh táo hơn.)" },
                { en: "maintain + N", vi: "maintain a healthy weight (duy trì cân nặng hợp lý.)" },

            ],
            lvl1: [
                { text: "People who exercise regularly are less _______ to get sick.", ans: "likely" },

            ],
            lvl2: [

        },
        {

            grammar: [
                { en: "V-ing + V", vi: "Recycling brings many benefits... (Việc tái chế mang lại nhiều lợi ích...)" },

                { en: "help + V", vi: "helps reduce the amount of waste (giúp giảm lượng rác thải)" },
                { en: "the amount of + N không đếm được", vi: "the amount of waste (lượng rác thải)" },

                { en: "become + adj", vi: "becomes cleaner and healthier (trở nên sạch hơn và lành mạnh hơn)" },
                { en: "help + V", vi: "helps save natural resources (giúp tiết kiệm tài nguyên thiên nhiên)" },
                { en: "such as + N", vi: "such as wood, water, and minerals (chẳng hạn như gỗ, nước và khoáng sản)" },
                { en: "Instead of + N/V-ing", vi: "Instead of using new materials... (Thay vì sử dụng vật liệu mới...)" },
                { en: "can + V", vi: "can reuse old ones (có thể tái sử dụng những thứ cũ)" },
                { en: "to V", vi: "to make new products (để tạo ra sản phẩm mới)" },
                { en: "because + mệnh đề", vi: "because producing goods... (bởi vì việc sản xuất hàng hóa...)" },
                { en: "require + N", vi: "requires less energy (đòi hỏi ít năng lượng hơn)" },
                { en: "help + V", vi: "helps reduce pollution (giúp giảm ô nhiễm)" },
                { en: "protect + N", vi: "protect the environment (bảo vệ môi trường)" },
                { en: "encourage + sb + to V", vi: "encourages people to develop good habits (khuyến khích mọi người hình thành thói quen tốt)" },
                { en: "become + adj", vi: "become more responsible (trở nên có trách nhiệm hơn)" },

            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "As a result,", vi: "Kết quả là," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "Recycling helps reduce the _______ of waste in landfills.", ans: "amount" },
                { text: "Instead of using new materials, people can _______ old ones.", ans: "reuse" },
                { text: "It encourages people to develop good habits and become more _______.", ans: "responsible" }
            ],
            lvl2: [
                { text: "_______, it helps reduce the amount of waste in landfills.", ans: "First of all" },
                { text: "_______, recycling helps save natural resources such as wood.", ans: "Furthermore" },
                { text: "_______, recycling has many advantages, and I believe everyone should take part.", ans: "In conclusion" }
            ]
        }
    ];

    let currentTopicIndex = 0;
    let currentMainTab = 0;
    let currentSubTab = 0;

    // Trạng thái lưu trữ số câu đúng của người học trên mỗi cấp độ bài tập
    let scoresStorage = {
        lvl1: {},
        lvl2: {}
    };

    function init() {
        renderMenu();
    }

    // HIỂN THỊ DANH SÁCH MENU CHỦ ĐỀ CHUẨN ĐẸP
    function renderMenu() {
        const listDiv = document.getElementById('topic-list-render');
        let html = '';
        topicsData.forEach((topic, index) => {
            const scoreLvl1 = scoresStorage.lvl1[index] !== undefined ? scoresStorage.lvl1[index] : 0;
            const scoreLvl2 = scoresStorage.lvl2[index] !== undefined ? scoresStorage.lvl2[index] : 0;
            const maxLvl1 = topic.lvl1.length;
            const maxLvl2 = topic.lvl2.length;

            html += `
                <div class="topic-card" onclick="selectTopic(${index})">
                    <div class="topic-card-left">
                        <h3>${index + 1}. ${topic.title}</h3>
                        <p>${topic.desc}</p>
                        <div class="topic-badges">
                            <span class="badge-lvl1">⭐ Cấp độ 1: ${scoreLvl1}/${maxLvl1}</span>
                            <span class="badge-lvl2">🏆 Cấp độ 2: ${scoreLvl2}/${maxLvl2}</span>
                        </div>
                    </div>
                    <div class="arrow-right">➔</div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function selectTopic(index) {
        currentTopicIndex = index;
        document.getElementById('view-menu').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('prompt-text').innerText = topicsData[index].prompt;
        
        changeMainTab(0);
    }

    function showMenuScreen() {
        document.getElementById('view-detail').style.display = 'none';
        document.getElementById('view-menu').style.display = 'block';
        renderMenu();
    }

    // ĐIỀU KHIỂN TABS LỚN
    function changeMainTab(tabIndex) {
        currentMainTab = tabIndex;
        
        // Cập nhật giao diện nút tab lớn
        for(let i=0; i<3; i++) {
            document.getElementById(`mtab-${i}`).classList.toggle('active', i === tabIndex);
        }

        const subTabsWrapper = document.getElementById('wrap-sub-tabs');
        if (tabIndex === 0) {
            subTabsWrapper.style.display = 'flex';
            changeSubTab(0);
        } else {
            subTabsWrapper.style.display = 'none';
            renderExerciseView(tabIndex);
        }
    }

    // ĐIỀU KHIỂN TABS NHỎ LÝ THUYẾT
    function changeSubTab(subIndex) {
        currentSubTab = subIndex;
        for(let i=0; i<3; i++) {
            document.getElementById(`stab-${i}`).classList.toggle('active', i === subIndex);
        }
        renderTheoryView(subIndex);
    }

    // NỘI DUNG TẢI LÝ THUYẾT (TAB 1) KÈM CẤU TRÚC VÀ BẢN DỊCH CHUẨN XÁC
    function renderTheoryView(subIndex) {
        const bodyPanel = document.getElementById('panel-body');
        const data = topicsData[currentTopicIndex];
        let html = '';

        if (subIndex === 0) {
            // Hiện Cấu Trúc Chung Cố Định & Bảng Ngữ Pháp Riêng
            html += `<div style="margin-bottom: 25px; padding: 15px; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px;">`;
            html += `<h3 style="margin-top:0; color:#0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px;">CẤU TRÚC CHUNG (GENERAL STRUCTURE)</h3>`;
            
            html += `<div class="structure-title">Mở đoạn (chọn 1 trong 3)</div>`;
            generalStructure.intro.forEach(item => {
                html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`;
            });

            html += `<div class="structure-title">Luận điểm</div>`;
            generalStructure.body.forEach(item => {
                html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`;
            });

            html += `<div class="structure-title">Kết đoạn (chọn 1 trong 2)</div>`;
            generalStructure.conclusion.forEach(item => {
                html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`;
            });
            html += `</div>`;

            // Bảng cấu trúc ngữ pháp chi tiết của riêng bài viết đó
            html += `<h3 style="color:#0f172a; margin-bottom:12px;">Cấu trúc ngữ pháp nâng cao bài viết</h3>`;
            data.grammar.forEach(item => {
                html += `
                    <div class="structure-section">
                        <div class="text-en">❖ ${item.en}</div>
                        <div class="text-vi">${item.vi}</div>
                    </div>
                `;
            });
        } 
        else if (subIndex === 1) {
            // Tải danh sách từ nối có kèm dịch nghĩa tiếng việt gốc
            html += `<h3>Từ nối đoạn văn (Connectors)</h3>`;
            data.connectors.forEach(item => {
                html += `
                    <div class="structure-section">
                        <div class="text-en" style="color: var(--primary-color);">${item.en}</div>
                        <div class="text-vi">Nghĩa: <b>${item.vi}</b></div>
                    </div>
                `;
            });
        } 
        else if (subIndex === 2) {
            // Tải nguyên văn bài văn mẫu
            html += `<div class="essay-display">${data.essay}</div>`;
            // Kích hoạt ghi nhận vào hệ thống nhật ký an toàn khi người học bấm đọc bài mẫu thành công
            saveHistoryData();
        }

        bodyPanel.innerHTML = html;
    }

    // NỘI DUNG TẢI BÀI TẬP THỰC HÀNH CẤP ĐỘ 1 & 2 KHÔNG THIẾU TỪ
    function renderExerciseView(tabIndex) {
        const bodyPanel = document.getElementById('panel-body');
        const data = topicsData[currentTopicIndex];
        const questionsList = (tabIndex === 1) ? data.lvl1 : data.lvl2;
        
        let html = `<div class="exercise-container">`;
        html += `<p style="font-weight: 600; color: #475569; margin: 0;">Điền cụm từ chính xác vào khoảng trống bên dưới:</p>`;

        questionsList.forEach((q, idx) => {
            const splitParts = q.text.split("_______");
            html += `
                <div class="exercise-item">
                    <div class="exercise-text">
                        <span>${idx + 1}. ${splitParts[0]}</span>
                        <input type="text" class="input-blank" id="blank-input-${idx}" autocomplete="off" placeholder="Nhập từ...">
                        <span>${splitParts[1]}</span>
                    </div>
                    <div class="feedback" id="feedback-line-${idx}"></div>
                </div>
            `;
        });

        html += `<button class="btn-submit" onclick="gradeExerciseAnswers(${tabIndex})">Nộp bài & Kiểm tra đáp án</button>`;
        html += `</div>`;
        
        bodyPanel.innerHTML = html;
    }

    // KIỂM TRA ĐÁP ÁN BÀI TẬP VÀ HIỂN THỊ KẾT QUẢ TRỰC DIỆN KHÔNG THIẾU SÓT
    function gradeExerciseAnswers(tabIndex) {
        const data = topicsData[currentTopicIndex];
        const questionsList = (tabIndex === 1) ? data.lvl1 : data.lvl2;
        let rightCount = 0;

        questionsList.forEach((q, idx) => {
            const currentField = document.getElementById(`blank-input-${idx}`);
            const feedbackField = document.getElementById(`feedback-line-${idx}`);
            const textValue = currentField.value.trim();

            if (textValue.toLowerCase() === q.ans.toLowerCase()) {
                feedbackField.innerText = "🟢 Chính xác!";
                feedbackField.className = "feedback correct";
                rightCount++;
            } else {
                feedbackField.innerHTML = `🔴 Chưa đúng! Đáp án chuẩn xác: <u>${q.ans}</u>`;
                feedbackField.className = "feedback wrong";
            }
        });

        // Ghi lại điểm số đạt được vào bộ nhớ tạm để hiển thị badge ngoài Menu
        if (tabIndex === 1) {
            scoresStorage.lvl1[currentTopicIndex] = rightCount;
        } else {
            scoresStorage.lvl2[currentTopicIndex] = rightCount;
        }
    }

    // ĐỒNG BỘ LIÊN KẾT NHẬT KÝ ĐA BIẾN VỚI FILE LICH_SU.HTML QUA LOCALSTORAGE AN TOÀN
    function saveHistoryData() {
        try {
            let historyList = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let currentTime = new Date();
            let formatTimeStr = currentTime.toLocaleDateString('vi-VN') + ' ' + currentTime.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});

            historyList.unshift({
                date: formatTimeStr,
                thoiGian: formatTimeStr,
                skill: 'Writing',
                kyNang: 'Writing',
                topic: `Benefits - ${topicsData[currentTopicIndex].title}`,
                chuDe: `Benefits - ${topicsData[currentTopicIndex].title}`,
                type: 'Paragraph Writing',
                capDo: 'Đoạn văn (B1)',
                score: 100,
                total: 100,
                diemSo: 'Đã học thuộc lòng bài mẫu'
            });

            // Giới hạn bộ nhớ lưu trữ tối đa 50 lượt gần nhất
            if (historyList.length > 50) historyList.pop();
            localStorage.setItem('vstep_learning_history', JSON.stringify(historyList));
        } catch(error) {
            console.error("Không thể lưu kết quả vào hệ thống log", error);
        }
    }

    // Khởi động khi tải xong trang web
    window.onload = init;
</script>
