<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP Writing B1 - Benefits Paragraphs</title>
    <style>
        :root {
            --primary-color: #10b981; /* Xanh ngọc lục bảo chủ đạo dạng Benefits */
            --dark-color: #064e3b;    /* Xanh lá đậm */
            --bg-color: #f0fdf4;      /* Nền nhạt dịu mắt */
            --accent-color: #34d399;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-box {
            background-color: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(6, 78, 59, 0.05);
            width: 100%;
            max-width: 600px;
            border: 2px solid #a7f3d0;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .benefit-icon {
            font-size: 45px;
            margin-bottom: 5px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
            text-align: center;
        }

        .btn-back {
            background: none;
            border: none;
            color: #059669;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            margin-bottom: 15px;
            display: inline-block;
            padding: 0;
        }

        /* Giao diện danh sách chủ đề (Màn hình 1) */
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .topic-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .topic-item:hover {
            border-color: var(--primary-color);
            background-color: #f9fbf9;
            transform: translateY(-2px);
        }

        .topic-info {
            text-align: left;
            flex: 1;
        }

        .topic-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 4px;
        }

        .topic-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.4;
        }

        .topic-status {
            font-size: 12px;
            color: #059669;
            margin-top: 6px;
            font-weight: 500;
        }

        .arrow-icon {
            font-size: 18px;
            color: #94a3b8;
            margin-left: 15px;
        }

        /* Giao diện học chi tiết (Màn hình 2) */
        .prompt-box {
            background-color: #f8fafc;
            border-left: 5px solid var(--primary-color);
            padding: 15px;
            border-radius: 4px 12px 12px 4px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Thanh phân cấp bài tập lớn */
        .main-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .main-tab {
            padding: 12px 5px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            color: #475569;
        }

        .main-tab.active {
            background-color: #e2e8f0;
            color: var(--dark-color);
            border-color: #94a3b8;
        }

        /* Thanh phân cấp lý thuyết nhỏ bên trong */
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .sub-tab {
            padding: 8px 14px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            position: relative;
        }

        .sub-tab.active {
            color: var(--primary-color);
        }

        .sub-tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        /* Khung hiển thị nội dung học */
        .display-panel {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            min-height: 200px;
            margin-bottom: 20px;
        }

        .essay-text {
            font-family: 'Georgia', serif;
            font-size: 16px;
            line-height: 1.7;
            color: #0f172a;
            text-align: justify;
            white-space: pre-line;
        }

        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .grid-item {
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 10px;
        }

        .grid-item:last-child {
            border: none;
        }

        .eng-phrase {
            font-weight: bold;
            color: #047857;
            font-size: 15px;
        }

        .vie-phrase {
            color: #475569;
            font-size: 14px;
            margin-top: 3px;
        }

        /* Thiết kế phần thực hành điền từ */
        .practice-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sentence-item {
            text-align: left;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .blank-input {
            padding: 6px 10px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--dark-color);
            outline: none;
            width: 160px;
            text-align: center;
        }

        .blank-input:focus {
            border-color: var(--primary-color);
        }

        .btn-check-ans {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-check-ans:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="main-box">
    
    <div id="screen-menu">
        <button class="btn-back" onclick="window.location.href='writing.html'">⬅ Quay lại Menu Viết Thư</button>
        <h2>Select a Benefits Paragraph Topic</h2>
        <div class="topic-list" id="menu-topics-container"></div>
    </div>

    <div id="screen-detail" style="display: none;">
        <button class="btn-back" onclick="backToMenuList()">⬅ Chọn Chủ Đề Khác</button>
        <div class="prompt-box" id="prompt-display"></div>

        <div class="main-tabs">
            <div class="main-tab active" id="tab-btn-0" onclick="switchMainTab(0)">1. Cấu trúc, Từ nối & Bài mẫu</div>
            <div class="main-tab" id="tab-btn-1" onclick="switchMainTab(1)">2. Cấp độ 1</div>
            <div class="main-tab" id="tab-btn-2" onclick="switchMainTab(2)">3. Cấp độ 2</div>
        </div>

        <div class="sub-tabs" id="theory-sub-tabs">
            <button class="sub-tab active" id="sub-btn-0" onclick="switchSubTab(0)">📐 1. Cấu trúc</button>
            <button class="sub-tab" id="sub-btn-1" onclick="switchSubTab(1)">🔗 2. Từ nối</button>
            <button class="sub-tab" id="sub-btn-2" onclick="switchSubTab(2)">📝 3. Thực hành bài mẫu</button>
        </div>

        <div class="display-panel" id="panel-content"></div>
    </div>
</div>

<script>
    // DATA 4 BÀI VÀ CÁC CẤP ĐỘ THỰC HÀNH TƯƠNG ỨNG ĐẦY ĐỦ DỊCH TIẾNG VIỆT
    const benefitsData = [
        {
            title: "1. Keeping Pets",
            desc: "Write a paragraph (120–150 words) about the benefits of keeping pets.",
            prompt: "Write a paragraph (at least 120 words) about the benefits of keeping pets.",
            essay: "Keeping pets brings many great benefits to our modern lives. First of all, we cannot deny its useful values for our health. Having a pet helps people do more exercise. For example, if you have a dog, you need to walk it in the park every day. Furthermore, pets are excellent friends that can improve our mood. After a hard-working day, playing with popular pets such as cats or dogs is a good way to reduce stress. In addition, keeping pets is very good for families with children. It teaches children how to love animals and care for others. Last but not least, pets make our homes safer because dogs can guard the house. In conclusion, keeping a pet is very helpful, and we should treat them like a member of our family.",
            grammar: [
                { en: "Keeping + N + V", vi: "Nuôi thú cưng mang lại nhiều lợi ích..." },
                { en: "cannot deny + N", vi: "Chúng ta không thể phủ nhận những giá trị hữu ích của nó..." },
                { en: "help + sb + V", vi: "Nuôi thú cưng giúp con người tập thể dục nhiều hơn." },
                { en: "make + O + Adj", vi: "Thú cưng làm cho nhà của chúng ta an toàn hơn." }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "For example,", vi: "Ví dụ," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "Keeping pets _______ many great benefits to our modern lives.", ans: "brings" },
                { text: "Having a pet _______ people do more exercise.", ans: "helps" },
                { text: "Furthermore, pets are excellent friends that can _______ our mood.", ans: "improve" }
            ],
            lvl2: [
                { text: "_______, we cannot deny its useful values for our health.", ans: "First of all" },
                { text: "_______, keeping pets is very good for families with children.", ans: "In addition" },
                { text: "_______, keeping a pet is very helpful.", ans: "In conclusion" }
            ]
        },
        {
            title: "2. Renewable Energy",
            desc: "Write a paragraph (120–150 words) about the benefits of renewable energy.",
            prompt: "Write a paragraph (at least 120 words) about the benefits of renewable energy.",
            essay: "Renewable energy brings many benefits to our lives and the environment. First of all, it helps reduce air pollution. Sources of renewable energy such as solar energy and wind energy do not produce harmful gases. As a result, the air becomes cleaner and healthier for people. Furthermore, renewable energy can reduce the use of fossil fuels such as coal and oil. This helps protect natural resources for future generations. In addition, renewable energy is sustainable because it comes from natural sources that can be used again and again. Last but not least, using renewable energy can create new jobs in many areas. In conclusion, renewable energy has many advantages, and I believe that it is important for a cleaner and better future.",
            grammar: [
                { en: "help + V", vi: "Nó giúp giảm thiểu ô nhiễm không khí." },
                { en: "As a result, + Clause", vi: "Kết quả là, không khí trở nên sạch hơn." },
                { en: "can be + V3/ed", vi: "Nguồn năng lượng tự nhiên có thể được dùng đi dùng lại." }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "As a result,", vi: "Kết quả là," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "Renewable energy _______ many benefits to our lives.", ans: "brings" },
                { text: "It helps _______ air pollution.", ans: "reduce" },
                { text: "This helps _______ natural resources for future generations.", ans: "protect" }
            ],
            lvl2: [
                { text: "_______, it helps reduce air pollution.", ans: "First of all" },
                { text: "_______, the air becomes cleaner and healthier.", ans: "As a result" },
                { text: "_______, renewable energy has many advantages.", ans: "In conclusion" }
            ]
        },
        {
            title: "3. Regular Exercise",
            desc: "Write a paragraph (120–150 words) about the benefits of doing exercise regularly.",
            prompt: "Write a paragraph (at least 120 words) about the benefits of doing exercise regularly.",
            essay: "Doing exercise regularly brings many benefits to our health and daily life. First of all, it helps people stay healthy and strong. People who exercise regularly are less likely to get sick and often have more energy for work and study. Furthermore, exercise is a good way to reduce stress and improve mood. After a busy day, activities such as walking, jogging, or cycling can help people relax and feel happier. In addition, regular exercise can improve sleep quality, which helps people feel refreshed in the morning. Last but not least, doing exercise helps people maintain a healthy weight and live a more active lifestyle. In conclusion, regular exercise has many advantages, and I believe that everyone should make it a part of their daily routine.",
            grammar: [
                { en: "stay + Adj", vi: "Giúp mọi người giữ được sự khỏe mạnh và cường tráng." },
                { en: "be less likely to + V", vi: "Ít có khả năng bị đổ bệnh hơn." },
                { en: "be a good way to + V", vi: "Tập thể dục là một cách tốt để giảm căng thẳng." }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "It helps people _______ healthy and strong.", ans: "stay" },
                { text: "Exercise is a good way to _______ stress.", ans: "reduce" },
                { text: "Doing exercise helps people _______ a healthy weight.", ans: "maintain" }
            ],
            lvl2: [
                { text: "_______, it helps people stay healthy and strong.", ans: "First of all" },
                { text: "_______, regular exercise can improve sleep quality.", ans: "In addition" },
                { text: "_______, regular exercise has many advantages.", ans: "In conclusion" }
            ]
        },
        {
            title: "4. Recycling Activities",
            desc: "Write a paragraph (120–150 words) about the benefits of recycling.",
            prompt: "Write a paragraph (at least 120 words) about the benefits of recycling.",
            essay: "Recycling brings many benefits to the environment and our daily lives. First of all, it helps reduce the amount of waste in landfills. As a result, the environment becomes cleaner and healthier. Furthermore, recycling helps save natural resources such as wood, water, and minerals. Instead of using new materials, people can reuse old ones to make new products. In addition, recycling can save energy because producing goods from recycled materials often requires less energy than producing them from raw materials. Last but not least, recycling helps reduce pollution and protect the environment for future generations. In conclusion, recycling has many advantages, and I believe that everyone should take part in recycling activities.",
            grammar: [
                { en: "Instead of + V-ing", vi: "Thay vì sử dụng các nguyên liệu mới..." },
                { en: "require + N", vi: "Đòi hỏi ít năng lượng hơn việc sản xuất thông thường." },
                { en: "take part in + N", vi: "Mọi người nên tham gia các hoạt động tái chế rác." }
            ],
            connectors: [
                { en: "First of all,", vi: "Trước hết," },
                { en: "As a result,", vi: "Kết quả là," },
                { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," },
                { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1: [
                { text: "It helps _______ the amount of waste in landfills.", ans: "reduce" },
                { text: "The environment _______ cleaner and healthier.", ans: "becomes" },
                { text: "Recycling helps _______ natural resources.", ans: "save" }
            ],
            lvl2: [
                { text: "_______, it helps reduce the amount of waste.", ans: "First of all" },
                { text: "_______, recycling can save energy.", ans: "In addition" },
                { text: "_______, recycling has many advantages.", ans: "In conclusion" }
            ]
        }
    ];

    let activeTopicIndex = 0;
    let currentMainTab = 0;
    let currentSubTab = 0;

    // Sinh Menu chủ đề ban đầu giống hệt ảnh mẫu
    function renderMenu() {
        let menuHTML = "";
        benefitsData.forEach((item, index) => {
            menuHTML += `
                <div class="topic-item" onclick="openTopic(${index})">
                    <div class="topic-info">
                        <div class="topic-title">${item.title}</div>
                        <div class="topic-desc">${item.desc}</div>
                        <div class="topic-status">⭐ Sẵn sàng học | 🏆 Trạng thái: Trống</div>
                    </div>
                    <div class="arrow-icon">➔</div>
                </div>
            `;
        });
        document.getElementById('menu-topics-container').innerHTML = menuHTML;
    }

    function openTopic(index) {
        activeTopicIndex = index;
        document.getElementById('screen-menu').style.display = 'none';
        document.getElementById('screen-detail').style.display = 'block';
        document.getElementById('prompt-display').innerText = benefitsData[index].prompt;
        switchMainTab(0); // Mặc định mở tab lý thuyết & bài mẫu trước
    }

    function backToMenuList() {
        document.getElementById('screen-detail').style.display = 'none';
        document.getElementById('screen-menu').style.display = 'block';
    }

    // Điều khiển 3 Tab lớn
    function switchMainTab(tabIdx) {
        currentMainTab = tabIdx;
        for (let i = 0; i < 3; i++) {
            document.getElementById(`tab-btn-${i}`).classList.toggle('active', i === tabIdx);
        }

        const subTabsDiv = document.getElementById('theory-sub-tabs');
        if (tabIdx === 0) {
            subTabsDiv.style.display = 'flex';
            switchSubTab(0);
        } else {
            subTabsDiv.style.display = 'none';
            renderPracticeContent(tabIdx); // Mở Tab thực hành Cấp độ 1 hoặc Cấp độ 2
        }
    }

    // Điều khiển 3 Tab nhỏ lý thuyết
    function switchSubTab(subIdx) {
        currentSubTab = subIdx;
        for (let i = 0; i < 3; i++) {
            document.getElementById(`sub-btn-${i}`).classList.toggle('active', i === subIdx);
        }
        renderTheoryContent(subIdx);
    }

    // Đổ nội dung lý thuyết chi tiết dịch nghĩa đầy đủ
    function renderTheoryContent(subIdx) {
        const panel = document.getElementById('panel-content');
        const data = benefitsData[activeTopicIndex];
        let html = "";

        if (subIdx === 0) { // Cấu trúc ngữ pháp
            html += `<div class="grid-list">`;
            data.grammar.forEach(item => {
                html += `
                    <div class="grid-item">
                        <div class="eng-phrase">❖ Công thức: ${item.en}</div>
                        <div class="vie-phrase">👉 <b>Ví dụ:</b> ${item.vi}</div>
                    </div>`;
            });
            html += `</div>`;
        } 
        else if (subIdx === 1) { // Từ nối mẫu
            html += `<div class="grid-list" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
            data.connectors.forEach(item => {
                html += `
                    <div class="grid-item" style="border: 1px solid #e2e8f0; padding:10px; border-radius:8px;">
                        <div class="eng-phrase" style="color:#0284c7;">${item.en}</div>
                        <div class="vie-phrase">Nghĩa: <b>${item.vi}</b></div>
                    </div>`;
            });
            html += `</div>`;
        } 
        else if (subIdx === 2) { // Bài viết mẫu chuẩn chỉnh
            html += `<div class="essay-text">${data.essay}</div>`;
            // Tự động kích hoạt cơ chế ghi nhận nhật ký hệ thống an toàn đa biến khi học xong bài mẫu
            saveToHistory();
        }

        panel.innerHTML = html;
    }

    // Đổ nội dung điền từ thực hành (Cấp độ 1 & Cấp độ 2) bị bỏ quên
    function renderPracticeContent(tabIdx) {
        const panel = document.getElementById('panel-content');
        const data = benefitsData[activeTopicIndex];
        const listQuestions = (tabIdx === 1) ? data.lvl1 : data.lvl2;

        let html = `<div class="practice-container">`;
        html += `<p style="font-weight:600; color:#475569; margin-bottom:10px;">Điền từ thích hợp vào ô trống:</p>`;
        
        listQuestions.forEach((q, i) => {
            let parts = q.text.split("_______");
            html += `
                <div class="sentence-item">
                    <span>${i + 1}. ${parts[0]}</span>
                    <input type="text" class="blank-input" id="blank-ans-${i}" placeholder="Nhập đáp án...">
                    <span>${parts[1]}</span>
                    <div id="feedback-${i}" style="margin-top: 5px; font-weight: bold; font-size:14px;"></div>
                </div>
            `;
        });

        html += `<button class="btn-check-ans" onclick="checkPracticeAnswers(${tabIdx})">Nộp bài & Kiểm tra đáp án</button>`;
        html += `</div>`;
        panel.innerHTML = html;
    }

    // Kiểm tra kết quả điền từ bài tập thực hành
    function checkPracticeAnswers(tabIdx) {
        const data = benefitsData[activeTopicIndex];
        const listQuestions = (tabIdx === 1) ? data.lvl1 : data.lvl2;
        let correctCount = 0;

        listQuestions.forEach((q, i) => {
            const userAns = document.getElementById(`blank-ans-${i}`).value.trim();
            const feedback = document.getElementById(`feedback-${i}`);
            
            // So khớp không phân biệt hoa thường
            if (userAns.toLowerCase() === q.ans.toLowerCase()) {
                feedback.innerHTML = "🟢 Đúng rồi!";
                feedback.style.color = "#16a34a";
                correctCount++;
            } else {
                feedback.innerHTML = `🔴 Sai rồi! Đáp án chuẩn: <span style="text-decoration:underline;">${q.ans}</span>`;
                feedback.style.color = "#dc2626";
            }
        });
    }

    // Đồng bộ an toàn đa biến trực tiếp với file lịch sử tổng thể
    function saveToHistory() {
        try {
            let history = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let now = new Date();
            let dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});

            history.unshift({
                date: dateStr,
                thoiGian: dateStr,
                skill: 'Writing',
                kyNang: 'Writing',
                topic: `Benefits - ${benefitsData[activeTopicIndex].title.split(". ")[1]}`,
                chuDe: `Benefits - ${benefitsData[activeTopicIndex].title.split(". ")[1]}`,
                type: 'Paragraph Writing',
                capDo: 'Đoạn văn (B1)',
                score: 100,
                total: 100,
                diemSo: 'Đã thuộc bài mẫu'
            });

            if (history.length > 50) history.pop();
            localStorage.setItem('vstep_learning_history', JSON.stringify(history));
        } catch(e) {
            console.log("Lỗi LocalStorage.");
        }
    }

    // Khởi chạy ứng dụng
    renderMenu();
</script>
