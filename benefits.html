<!DOCTYPE html>

<head>

    <title>VSTEP Writing B1 - Benefits Paragraphs</title>
    <style>
        :root {

            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--dark-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .btn-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 25px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            padding: 0;
        }

        .btn-link:hover { text-decoration: underline; }
        .page-title { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 30px; }

        /* MÀN HÌNH 1: DANH SÁCH CHỦ ĐỀ */
        .topic-list { display: flex; flex-direction: column; gap: 16px; }
        .topic-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .topic-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
        }
        .topic-card-left h3 { margin: 0 0 6px 0; font-size: 18px; }
        .topic-card-left p { margin: 0 0 8px 0; color: #64748b; font-size: 14px; }
        .topic-badges { display: flex; gap: 12px; font-size: 13px; font-weight: 600; }
        .badge-lvl1 { color: #eab308; }
        .badge-lvl2 { color: #10b981; }

        /* MÀN HÌNH 2: CHI TIẾT */
        .header-detail { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status-learning { background-color: #64748b; color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .prompt-container {
            border-left: 4px solid var(--primary-color);
            background-color: #f0f9ff;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;

        .sub-btn.active { color: var(--primary-color); background-color: #f0f9ff; border-radius: 6px; }

        .panel-content { line-height: 1.7; font-size: 15px; }
        .text-en { font-weight: 600; color: #0f172a; margin-top: 5px; }
        .text-vi { color: #64748b; font-style: italic; margin-bottom: 15px; }
        
        .essay-display {
            font-family: 'Georgia', serif;
            font-size: 16px;
            text-align: justify;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            white-space: pre-line;
            line-height: 2;
        }

        .input-blank {

            border-bottom: 2px solid #cbd5e1;
            background: #f1f5f9;
            padding: 2px 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary-color);
            text-align: center;

        .input-blank.wrong-inline { background-color: #fee2e2; border-bottom-color: #ef4444; color: #ef4444; }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-submit:hover { background-color: #0369a1; }
        .score-summary { margin-top: 15px; font-size: 16px; font-weight: bold; color: var(--primary-color); }
    </style>
</head>

            ],
            // Khuyết từ vựng đơn (Cấp độ 1)

            lvl1Tokens: ["brings", "modern", "health", "exercise", "walk", "park", "friends", "improve", "playing", "reduce", "families", "teaches", "animals", "safer", "guard"],

            translation: "Năng lượng tái tạo mang lại nhiều lợi ích cho cuộc sống của chúng ta và môi trường. Trước hết, nó giúp giảm thiểu ô nhiễm không khí. Các nguồn năng lượng tái tạo như năng lượng mặt trời và năng lượng gió không tạo ra khí độc hại. Kết quả là, không khí trở nên sạch hơn và lành mạnh hơn cho con người. Hơn nữa, năng lượng tái tạo có thể giảm việc sử dụng các nhiên liệu hóa thạch như than đá và dầu mỏ. Điều này giúp bảo vệ tài nguyên thiên nhiên cho các thế hệ tương lai. Ngoài ra, năng lượng tái tạo mang tính bền vững vì nó đến từ các nguồn tự nhiên có thể sử dụng đi sử dụng lại. Cuối cùng nhưng không kém phần quan trọng, sử dụng năng lượng tái tạo có thể tạo ra công ăn việc làm mới trong nhiều lĩnh vực. Nhiều người hơn có thể tìm thấy việc làm trong ngành năng lượng và cải thiện cuộc sống của họ. Kết luận lại, năng lượng tái tạo có nhiều ưu điểm, và tôi tin rằng nó rất quan trọng cho một tương lai sạch hơn và tốt đẹp hơn.",

        {

            translation: "Tập thể dục thường xuyên mang lại nhiều lợi ích cho sức khỏe và cuộc sống hàng ngày của chúng ta. Trước hết, nó giúp mọi người luôn khỏe mạnh và cường tráng. Những người tập thể dục thường xuyên ít có nguy cơ bị đổ bệnh hơn và thường có nhiều năng lượng hơn cho công việc và học tập. Hơn nữa, tập thể dục là một cách tốt để giảm căng thẳng và cải thiện tâm trạng. Sau một ngày bận rộn, các hoạt động như đi bộ, chạy bộ hoặc đạp xe có thể giúp mọi người thư giãn và cảm thấy hạnh phúc hơn. Ngoài ra, tập thể dục thường xuyên có thể cải thiện chất lượng giấc ngủ, giúp mọi người cảm thấy sảng khoái vào buổi sáng. Cuối cùng nhưng không kém phần quan trọng, tập thể dục giúp mọi người duy trì cân nặng hợp lý và sống một lối sống năng động hơn. Kết luận lại, tập thể dục thường xuyên có nhiều lợi ích, và tôi tin rằng mọi người nên biến nó thành một phần trong thói quen hàng ngày của họ.",

            prompt: "Recycling is becoming more important in modern society. Write a paragraph (120–150 words) about the benefits of recycling.",
            essay: "Recycling brings many benefits to the environment and our daily lives. First of all, it helps reduce the amount of waste in landfills. As a result, the environment becomes cleaner and healthier. Furthermore, recycling helps save natural resources such as wood, water, and minerals. Instead of using new materials, people can reuse old ones to make new products. In addition, recycling can save energy because producing goods from recycled materials often requires less energy than producing them from raw materials. Last but not least, recycling helps reduce pollution and protect the environment for future generations. It also encourages people to develop good habits and become more responsible. In conclusion, recycling has many advantages, and I believe that everyone should take part in recycling activities.",
            translation: "Tái chế mang lại nhiều lợi ích cho môi trường và cuộc sống hàng ngày của chúng ta. Trước hết, nó giúp giảm lượng rác thải tại các bãi chôn lấp. Kết quả là, môi trường trở nên sạch sẽ và lành mạnh hơn. Hơn nữa, tái chế giúp tiết kiệm các tài nguyên thiên nhiên như gỗ, nước và khoáng sản. Thay vì sử dụng các vật liệu mới, người dân có thể tái sử dụng các vật liệu cũ để tạo ra sản phẩm mới. Ngoài ra, tái chế có thể tiết kiệm năng lượng vì sản xuất hàng hóa từ vật liệu tái chế thường đòi hỏi ít năng lượng hơn so với sản xuất từ nguyên liệu thô. Cuối cùng nhưng không kém phần quan trọng, tái chế giúp giảm ô nhiễm và bảo vệ môi trường cho các thế hệ tương lai. Nó cũng khuyến khích mọi người phát triển các thói quen tốt và trở nên có trách nhiệm hơn. Kết luận lại, tái chế có nhiều ưu điểm, và tôi tin rằng tất cả mọi người nên tham gia vào các hoạt động tái chế.",
            connectors: [
                { en: "First of all,", vi: "Trước hết," }, { en: "As a result,", vi: "Kết quả là," },
                { en: "Furthermore,", vi: "Hơn nữa," }, { en: "Instead of", vi: "Thay vì" },
                { en: "In addition,", vi: "Ngoài ra," }, { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," },
                { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1Tokens: ["brings", "environment", "waste", "landfills", "cleaner", "healthier", "save", "materials", "reuse", "products", "energy", "requires", "pollution", "future", "responsible"],
            lvl2Tokens: ["brings many benefits to", "First of all", "the amount of waste", "As a result", "Furthermore", "Instead of using new materials", "In addition", "requires less energy than", "Last but not least", "In conclusion"]
        }
    ];

    let currentTopicIndex = 0;
    let scoresStorage = { lvl1: {}, lvl2: {} };

    window.onload = function() { renderMenu(); };

    function renderMenu() {
        const listDiv = document.getElementById('topic-list-render');
        let html = '';
        topicsData.forEach((topic, index) => {
            let s1 = scoresStorage.lvl1[index] !== undefined ? scoresStorage.lvl1[index] : 0;
            let s2 = scoresStorage.lvl2[index] !== undefined ? scoresStorage.lvl2[index] : 0;
            html += `
                <div class="topic-card" onclick="selectTopic(${index})">
                    <div class="topic-card-left">
                        <h3>${index + 1}. ${topic.title}</h3>
                        <p>${topic.desc}</p>
                        <div class="topic-badges">
                            <span class="badge-lvl1">⭐ Cấp độ 1: ${s1}/${topic.lvl1Tokens.length}</span>
                            <span class="badge-lvl2">🏆 Cấp độ 2: ${s2}/${topic.lvl2Tokens.length}</span>
                        </div>
                    </div>
                    <div class="arrow-right">➔</div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function selectTopic(index) {
        currentTopicIndex = index;
        document.getElementById('view-menu').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('prompt-text').innerText = topicsData[index].prompt;
        changeMainTab(0);
    }

    function showMenuScreen() {
        document.getElementById('view-detail').style.display = 'none';
        document.getElementById('view-menu').style.display = 'block';
        renderMenu();
    }

    function changeMainTab(tabIndex) {
        for(let i=0; i<3; i++) {
            document.getElementById(`mtab-${i}`).classList.toggle('active', i === tabIndex);
        }
        const subTabs = document.getElementById('wrap-sub-tabs');
        if (tabIndex === 0) {
            subTabs.style.display = 'flex';
            changeSubTab(0);
        } else {
            subTabs.style.display = 'none';
            renderExerciseView(tabIndex);
        }
    }

    function changeSubTab(subIndex) {
        for(let i=0; i<3; i++) {
            document.getElementById(`stab-${i}`).classList.toggle('active', i === subIndex);
        }
        renderTheoryView(subIndex);
    }

    // HIỂN THỊ LÝ THUYẾT (TAB 1)
    function renderTheoryView(subIndex) {
        const bodyPanel = document.getElementById('panel-body');
        const data = topicsData[currentTopicIndex];
        let html = '';

        if (subIndex === 0) {
            // Đúng yêu cầu: Chỉ hiện bảng cấu trúc chung và bỏ phần nâng cao
            html += `<div style="padding: 15px; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px;">`;
            html += `<h3 style="margin-top:0; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px;">CẤU TRÚC CHUNG (GENERAL STRUCTURE)</h3>`;
            
            html += `<div style="font-weight:700; color:var(--primary-color); margin-top:10px;">Mở đoạn (chọn 1 trong 3)</div>`;
            generalStructure.intro.forEach(item => { html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`; });

            html += `<div style="font-weight:700; color:var(--primary-color); margin-top:10px;">Luận điểm</div>`;
            generalStructure.body.forEach(item => { html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`; });

            html += `<div style="font-weight:700; color:var(--primary-color); margin-top:10px;">Kết đoạn (chọn 1 trong 2)</div>`;
            generalStructure.conclusion.forEach(item => { html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`; });
            html += `</div>`;
        } 
        else if (subIndex === 1) {
            html += `<h3>Từ nối đoạn văn (Connectors)</h3>`;
            data.connectors.forEach(item => {
                html += `<div style="margin-bottom:10px;"><span style="color:var(--primary-color); font-weight:bold;">${item.en}</span> <span style="color:#64748b; font-style:italic;">— ${item.vi}</span></div>`;
            });
        } 
        else if (subIndex === 2) {
            // Có đầy đủ phần dịch bài mẫu đi kèm chuẩn chỉnh
            html += `<h3>Bài viết mẫu (Model Essay)</h3>`;
            html += `<div class="essay-display">${data.essay}</div>`;
            html += `<h3 style="margin-top:20px;">Bản dịch tiếng Việt</h3>`;
            html += `<div class="essay-display" style="background-color:#f0fdf4; border-color:#bbf7d0; color:#334155;">${data.translation}</div>`;
        }
        bodyPanel.innerHTML = html;
    }

    // HIỂN THỊ BÀI TẬP ĐỤC LỖ NGUYÊN BÀI MẪU (TAB 2 & 3)
    function renderExerciseView(level) {
        const bodyPanel = document.getElementById('panel-body');
        const data = topicsData[currentTopicIndex];
        const tokens = (level === 1) ? data.lvl1Tokens : data.lvl2Tokens;
        
        let processedEssay = data.essay;
        
        // Tiến hành đục lỗ văn bản một cách thông minh, chính xác dựa trên danh sách từ khóa bài học
        tokens.forEach((token, idx) => {
            // Định nghĩa regex tìm kiếm từ khớp chính xác từ không phân biệt hoa thường
            let regex = new RegExp(`\\b${token}\\b`, 'i');
            let match = processedEssay.match(regex);
            if (match) {
                let actualWord = match[0];
                let width = Math.max(actualWord.length * 10, 80);
                processedEssay = processedEssay.replace(regex, `<input type="text" class="input-blank" data-ans="${actualWord}" id="blank-${idx}" style="width:${width}px;" autocomplete="off">`);
            }
        });

        let html = `
            <div>
                <p style="font-weight: 600; color: #475569; margin-bottom:15px;">
                    ${level === 1 ? '<b>Cấp độ 1:</b> Điền từ vựng còn thiếu vào bài mẫu (Khuyết 13-15 từ)' : '<b>Cấp độ 2:</b> Điền từ nối hoặc mệnh đề ngắn vào bài mẫu (Khuyết câu 30-50%)'}
                </p>
                <div class="essay-display">${processedEssay}</div>
                <div id="exercise-score" class="score-summary"></div>
                <button class="btn-submit" onclick="checkAnswers(${level})">Nộp bài & Kiểm tra đáp án</button>
            </div>
        `;
        bodyPanel.innerHTML = html;
    }

    // KIỂM TRA ĐÁP ÁN VÀ GHI ĐIỂM CHI TIẾT THEO LOẠI CẤP ĐỘ LÊN LỊCH SỬ KHÔNG THIẾU SÓT
    function checkAnswers(level) {
        const data = topicsData[currentTopicIndex];
        const tokens = (level === 1) ? data.lvl1Tokens : data.lvl2Tokens;
        let correctCount = 0;

        tokens.forEach((token, idx) => {
            const input = document.getElementById(`blank-${idx}`);
            if(!input) return;
            
            const userAns = input.value.trim().toLowerCase();
            const correctAns = input.getAttribute('data-ans').toLowerCase();

            if (userAns === correctAns) {
                input.className = "input-blank correct-inline";
                correctCount++;
            } else {
                input.className = "input-blank wrong-inline";
                input.value = input.getAttribute('data-ans'); // Hiện đáp án đúng để học viên sửa sai
            }
        });

        // Cập nhật điểm số hiển thị ngoài Menu chính
        if (level === 1) {
            scoresStorage.lvl1[currentTopicIndex] = correctCount;
        } else {
            scoresStorage.lvl2[currentTopicIndex] = correctCount;
        }

        document.getElementById('exercise-score').innerText = `Kết quả: Đúng ${correctCount}/${tokens.length} câu.`;

        // Gọi hàm liên kết lưu dữ liệu đồng bộ sang file lịch sử học tập lich_su.html
        saveToHistoryPage(level, correctCount, tokens.length);
    }

    // LIÊN KẾT ĐỒNG BỘ LOCALSTORAGE VỚI FILE LICH_SU.HTML 
    function saveToHistoryPage(level, score, total) {
        try {
            let historyList = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let now = new Date();
            let timeStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            let levelLabel = (level === 1) ? "Cấp độ 1 (Khuyết từ vựng)" : "Cấp độ 2 (Khuyết cấu trúc/từ nối)";

            // Đẩy bản ghi mới lên đầu danh sách nhật ký hệ thống
            historyList.unshift({
                date: timeStr,
                thoiGian: timeStr,
                skill: 'Writing',
                kyNang: 'Writing',
                topic: `Benefits - ${topicsData[currentTopicIndex].title}`,
                chuDe: `Benefits - ${topicsData[currentTopicIndex].title}`,
                type: `Paragraph - ${levelLabel}`,
                capDo: `Đoạn văn (B1)`,
                score: score,
                total: total,
                diemSo: `${score}/${total} câu đúng`
            });

            if (historyList.length > 50) historyList.pop();
            localStorage.setItem('vstep_learning_history', JSON.stringify(historyList));
        } catch(e) {
            console.error("Lỗi đồng bộ lịch sử hệ thống", e);
        }
    }
</script>

</body>
</html>
