            font-weight: 600;

            prompt: "Recycling is becoming more important in modern society. Write a paragraph (120–150 words) about the benefits of recycling.",

            translation: "Tái chế mang lại nhiều lợi ích cho môi trường và cuộc sống hàng ngày của chúng ta. Trước hết, nó giúp giảm lượng rác thải tại các bãi chôn lấp. Kết quả là môi trường trở nên sạch sẽ và lành mạnh hơn. Hơn nữa, tái chế giúp tiết kiệm tài nguyên thiên nhiên như gỗ, nước và khoáng sản. Thay vì sử dụng vật liệu mới, người ta có thể tái sử dụng những vật liệu cũ để tạo ra sản phẩm mới. Ngoài ra, tái chế có thể tiết kiệm năng lượng vì sản xuất hàng hóa từ vật liệu tái chế thường đòi hỏi ít năng lượng hơn sản xuất chúng từ nguyên liệu thô. Cuối cùng nhưng không kém phần quan trọng, tái chế giúp giảm ô nhiễm và bảo vệ môi trường cho các thế hệ tương lai. Nó cũng khuyến khích mọi người phát triển các thói quen tốt và trở nên có trách nhiệm hơn. Kết luận lại, tái chế có nhiều ưu điểm, và tôi tin rằng mọi người nên tham gia vào các hoạt động tái chế.",
            connectors: [
                { en: "First of all,", vi: "Trước hết," }, { en: "As a result,", vi: "Kết quả là," }, { en: "Furthermore,", vi: "Hơn nữa," },
                { en: "In addition,", vi: "Ngoài ra," }, { en: "Last but not least,", vi: "Cuối cùng nhưng không kém phần quan trọng," }, { en: "In conclusion,", vi: "Kết luận lại," }
            ],
            lvl1Template: "Recycling [brings] many benefits to the environment and our daily lives. First of all, it helps [reduce] the [amount] of waste in landfills. As a result, the environment [becomes] cleaner and healthier. Furthermore, recycling helps [save] natural resources such as wood, water, and minerals. [Instead] of using new materials, people can [reuse] old ones to make new products. In addition, recycling can save [energy] because producing goods from recycled materials often [requires] less energy than producing them from raw materials. Last but not least, recycling helps reduce [pollution] and [protect] the environment for future generations. It also [encourages] people to develop good habits and become more [responsible]. In conclusion, recycling has many advantages, and I believe that everyone should [take] part in recycling activities.",
            lvl2Template: "[Recycling brings many benefits to the environment] and our daily lives. [First of all, it helps reduce the amount of waste] in landfills. As a result, the environment becomes cleaner and healthier. [Furthermore, recycling helps save natural resources] such as wood, water, and minerals. [Instead of using new materials, people can reuse old ones] to make new products. [In addition, recycling can save energy] because producing goods from recycled materials [often requires less energy than producing them from raw materials]. Last but not least, recycling helps reduce pollution and protect the environment for future generations. [It also encourages people to develop good habits] and become more responsible. [In conclusion, recycling has many advantages], and I believe that everyone should take part in recycling activities."
        }
    ];

    let currentTopicIndex = 0;
    let currentMainTab = 0;
    let currentSubTab = 0;
    let globalScores = { lvl1: {}, lvl2: {} };

    window.onload = function() {
        renderMenu();
    };

    function renderMenu() {
        const container = document.getElementById('topic-list-render');
        let html = '';
        topicsData.forEach((t, i) => {
            let s1 = globalScores.lvl1[i] || 0;
            let s2 = globalScores.lvl2[i] || 0;
            html += `
                <div class="topic-card" onclick="selectTopic(${i})">
                    <div class="topic-card-left">
                        <h3>1. ${t.title}</h3>
                        <p>${t.desc}</p>
                        <div class="topic-badges">
                            <span class="badge-lvl1">⭐ Cấp độ 1: ${s1}/${countBlanks(t.lvl1Template)}</span>
                            <span class="badge-lvl2">🏆 Cấp độ 2: ${s2}/${countBlanks(t.lvl2Template)}</span>
                        </div>
                    </div>
                    <div class="arrow-right">➔</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function countBlanks(str) {
        return (str.match(/\[.*?\]/g) || []).length;
    }

    function selectTopic(index) {
        currentTopicIndex = index;
        document.getElementById('view-menu').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('prompt-text').innerText = topicsData[index].prompt;
        changeMainTab(0);
    }

    function showMenuScreen() {
        document.getElementById('view-detail').style.display = 'none';
        document.getElementById('view-menu').style.display = 'block';
        renderMenu();
    }

    function changeMainTab(tabIdx) {
        currentMainTab = tabIdx;
        for(let i=0; i<3; i++) {
            document.getElementById(`mtab-${i}`).classList.toggle('active', i === tabIdx);
        }
        const subTabs = document.getElementById('wrap-sub-tabs');
        if(tabIdx === 0) {
            subTabs.style.display = 'flex';
            changeSubTab(0);
        } else {
            subTabs.style.display = 'none';
            renderExerciseView(tabIdx);
        }
    }

    function changeSubTab(subIdx) {
        currentSubTab = subIdx;
        for(let i=0; i<3; i++) {
            document.getElementById(`stab-${i}`).classList.toggle('active', i === subIdx);
        }
        renderTheoryView(subIdx);
    }

    function renderTheoryView(subIdx) {
        const body = document.getElementById('panel-body');
        const data = topicsData[currentTopicIndex];
        let html = '';

        if(subIdx === 0) {
            html += `<div class="structure-block">
                <h3 style="margin-top:0;">CẤU TRÚC CHUNG (GENERAL STRUCTURE)</h3>
                <div class="structure-heading">Mở đoạn (chọn 1 trong 3)</div>`;
            generalStructure.intro.forEach(item => {
                html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`;
            });
            html += `<div class="structure-heading">Luận điểm</div>`;
            generalStructure.body.forEach(item => {
                html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`;
            });
            html += `<div class="structure-heading">Kết đoạn (chọn 1 trong 2)</div>`;
            generalStructure.conclusion.forEach(item => {
                html += `<div class="text-en">${item.en}</div><div class="text-vi">${item.vi}</div>`;
            });
            html += `</div>`;
        } 
        else if(subIdx === 1) {
            html += `<h3>Từ nối đoạn văn (Connectors)</h3>`;
            data.connectors.forEach(c => {
                html += `<div class="structure-block">
                    <div class="text-en" style="color:var(--primary-color);">${c.en}</div>
                    <div class="text-vi">Nghĩa: <b>${c.vi}</b></div>
                </div>`;
            });
        } 
        else if(subIdx === 2) {
            html += `<h3>Bài mẫu & Dịch nghĩa song song</h3>`;
            html += `<div class="essay-display">
                <strong>[English]</strong><br>${data.essay}
                <div class="translation-display"><strong>[Tiếng Việt]</strong><br>${data.translation}</div>
            </div>`;
            saveHistoryData();
        }
        body.innerHTML = html;
    }

    function renderExerciseView(tabIdx) {
        const body = document.getElementById('panel-body');
        const data = topicsData[currentTopicIndex];
        const template = (tabIdx === 1) ? data.lvl1Template : data.lvl2Template;
        
        let answersArray = [];
        let count = 0;

        // Xử lý chuỗi đục lỗ dạng [đáp án]
        let exerciseHtml = template.replace(/\[(.*?)\]/g, function(match, answer) {
            answersArray.push(answer);
            let inputWidth = tabIdx === 1 ? '100px' : '320px';
            let htmlInput = `<input type="text" class="input-blank" style="width: ${inputWidth};" data-ans="${answer}" id="blank-${count}" autocomplete="off">`;
            count++;
            return htmlInput;
        });

        let html = `
            <div class="exercise-wrapper">
                ${exerciseHtml}
            </div>
            <div class="btn-action-container">
                <button class="btn-submit" onclick="checkExercise(${tabIdx}, ${count})">Kiểm tra đáp án</button>
                <div class="score-result" id="score-text"></div>
            </div>
        `;
        body.innerHTML = html;
    }

    function checkExercise(tabIdx, totalBlanks) {
        let correctCount = 0;
        for(let i = 0; i < totalBlanks; i++) {
            let inputElement = document.getElementById(`blank-${i}`);
            let userAns = inputElement.value.trim().toLowerCase();
            let correctAns = inputElement.getAttribute('data-ans').trim().toLowerCase();

            // Loại bỏ dấu câu cơ bản ở đuôi khi so sánh đối với cụm từ dài
            userAns = userAns.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
            correctAns = correctAns.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");

            if(userAns === correctAns) {
                inputElement.className = "input-blank verified-correct";
                correctCount++;
            } else {
                inputElement.className = "input-blank verified-wrong";
                inputElement.valueStr = inputElement.value;
                inputElement.title = `Đáp án đúng: ${inputElement.getAttribute('data-ans')}`;
            }
        }

        document.getElementById('score-text').innerHTML = `Kết quả: <span style="color:var(--success-color);">${correctCount}/${totalBlanks}</span> câu đúng. (Rê chuột vào ô đỏ để xem đáp án ẩn)`;
        
        if(tabIdx === 1) {
            globalScores.lvl1[currentTopicIndex] = correctCount;
        } else {
            globalScores.lvl2[currentTopicIndex] = correctCount;
        }
    }

    function saveHistoryData() {
        try {
            let historyList = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let currentTime = new Date();
            let formatTimeStr = currentTime.toLocaleDateString('vi-VN') + ' ' + currentTime.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});

            historyList.unshift({
                date: formatTimeStr,
                thoiGian: formatTimeStr,
                skill: 'Writing',
                kyNang: 'Writing',
                topic: `Benefits - ${topicsData[currentTopicIndex].title}`,
                chuDe: `Benefits - ${topicsData[currentTopicIndex].title}`,
                type: 'Paragraph Writing',
                capDo: 'Đoạn văn (B1)',
                score: 100,
                total: 100,
                diemSo: 'Đã xem lý thuyết bài mẫu'
            });

            if (historyList.length > 50) historyList.pop();
            localStorage.setItem('vstep_learning_history', JSON.stringify(historyList));
        } catch(error) {
            console.error(error);
        }
    }
</script>

</body>
</html>
