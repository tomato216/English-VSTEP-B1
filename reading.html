<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Reading Vocabulary</title>
    <style>
        :root { --primary-color: #f4b251; --dark-color: #8b5a2b; --bg-color: #fdf8f2; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .main-box { background-color: white; padding: 30px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; border: 3px solid #fcdfa8; }
        .btn-topic { background-color: #fffbf5; border: 2px solid #fcdfa8; border-radius: 15px; padding: 15px; margin: 8px; width: 40%; cursor: pointer; font-weight: bold; color: var(--dark-color); }
        .btn-option { padding: 12px; margin: 5px 0; width: 100%; border: 2px solid #eee; border-radius: 10px; cursor: pointer; background: white; }
        .btn-option:hover { background-color: #fffbf5; border-color: var(--primary-color); }
    </style>
</head>
<body>

<div id="app" class="main-box">
    <div id="content">
        <h2>Reading Vocabulary</h2>
        <div id="topic-list">
            <!-- Nút chủ đề sẽ tự tạo -->
        </div>
    </div>
</div>

<script>
    // --- CHỈ CẦN THÊM TỪ VÀO ĐÂY SAU NÀY ---
    const vocabularyData = {
        animals: [
            { word: "Species", mean: "Loài" },
            { word: "Biodiversity", mean: "Đa dạng sinh học" }
            // Thêm các từ animals của bạn ở đây...
        ],
        customs: [
            { word: "Unique", mean: "Độc đáo" },
            { word: "Lunar New Year", mean: "Tết Âm lịch" }
            // Thêm các từ customs ở đây...
        ],
        history: [],
        transport: [],
        environment: [],
        health: []
    };

    const topics = [
        { id: 'animals', name: '🐾 Animals' },
        { id: 'customs', name: '🎎 Customs' },
        { id: 'history', name: '📜 History' },
        { id: 'transport', name: '🚗 Transport' },
        { id: 'environment', name: '🌱 Environment' },
        { id: 'health', name: '💪 Health' }
    ];

    function showTopics() {
        let html = `<h2>Chọn chủ đề</h2>`;
        topics.forEach(t => {
            html += `<button class="btn-topic" onclick="startQuiz('${t.id}')">${t.name}</button>`;
        });
        document.getElementById('content').innerHTML = html;
    }

    function startQuiz(topicId) {
        if (!vocabularyData[topicId] || vocabularyData[topicId].length === 0) {
            alert("Chủ đề này chưa có từ vựng!"); return;
        }
        // Logic quiz... (bạn có thể giữ nguyên phần xử lý logic cũ ở đây)
    }

    showTopics();
</script>
</body>
</html>
