<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Reading Vocabulary</title>
    <style>
        :root {
            --primary-color: #ff6b8b;
            --bg-color: #ffeef2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng cánh hoa rơi nhẹ nhàng ở nền */
        .petal {
            position: absolute;
            background-color: #ffb6c1;
            border-radius: 150% 0 150% 150%;
            opacity: 0.6;
            pointer-events: none;
            animation: fade 6s infinite linear, float 6s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(60px) rotate(30deg); }
            100% { transform: translateX(0) rotate(60deg); }
        }

        /* Màn hình chọn chủ đề */
        #topic-screen {
            background-color: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 3px solid #ffccd5;
            z-index: 10;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .prompt-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-topic {
            background-color: #fff5f7;
            border: 2px solid #ffe0e6;
            border-radius: 15px;
            padding: 15px 10px;
            font-size: 15px;
            color: #444;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-topic:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: #ff4770;
            transform: translateY(-2px);
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* Màn hình làm bài tập (Đứng yên cố định, không hiệu ứng động) */
        #quiz-screen {
            display: none;
            background-color: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 3px solid #ffccd5;
            z-index: 10;
        }

        .cat-container { 
            display: flex; 
            justify-content: space-around; 
            margin-bottom: 20px; 
        }

        .cat { 
            font-size: 40px; 
            /* Đã bỏ thuộc tính chuyển động animate/transform ở đây */
        }

        .question { 
            font-size: 20px; 
            font-weight: bold; 
            color: #333; 
            margin-bottom: 20px; 
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 12px; 
            border: 2px solid #f0f0f0; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.2s, border-color 0.2s; 
            font-weight: 500; 
        }

        .btn-option:hover { 
            background-color: #fcf6f7; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 16px; 
            color: #666; 
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="topic-screen">
    <h2>Reading Practice 📖</h2>
    <div class="prompt-text">Hôm nay bạn muốn ôn tập từ vựng chủ đề nào? ✨</div>
    
    <div class="topic-grid">
        <button class="btn-topic" onclick="startQuiz('animals')">🐾 Animals</button>
        <button class="btn-topic" onclick="startQuiz('customs')">🎎 Customs & Traditions</button>
        <button class="btn-topic" onclick="startQuiz('history')">📜 History</button>
        <button class="btn-topic" onclick="startQuiz('transport')">🚗 Transport</button>
        <button class="btn-topic" onclick="startQuiz('environment')">🌱 Environment</button>
        <button class="btn-topic" onclick="startQuiz('health')">💪 Health & Fitness</button>
    </div>
    <button class="btn-back" onclick="window.location.href='index.html'">⬅ Quay lại Menu chính</button>
</div>

<div id="quiz-screen">
    <div class="cat-container">
        <div id="cat1" class="cat">🐱</div>
        <div id="cat2" class="cat">😸</div>
    </div>
    <div id="topic-title" style="color: var(--primary-color); font-weight: bold; margin-bottom: 10px;"></div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text">Câu hỏi: 0/0 | Điểm: 0</div>
    <button class="btn-back" onclick="showTopics()">⬅ Đổi chủ đề khác</button>
</div>

<script>
    // KHO TỪ VỰNG TRỐNG - Đợi bạn gửi danh sách từ vựng để nạp vào sau nhé!
    const vocabularyData = {
        animals: [],
        customs: [],
        history: [],
        transport: [],
        environment: [],
        health: []
    };

    let currentTopic = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // Phát âm thanh Tinh Tinh / Reng Reng cố định bằng phần cứng máy
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.frequency.setValueAtTime(type === 'correct' ? 1200 : 880, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        } catch(e) {}
    }

    // Tạo hiệu ứng cánh hoa rơi nhẹ nhàng tự động ở hình nền
    function createPetals() {
        const container = document.getElementById('petal-container');
        for (let i = 0; i < 12; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 10 + 8 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDelay = Math.random() * 6 + 's';
            petal.style.animationDuration = Math.random() * 4 + 5 + 's';
            container.appendChild(petal);
        }
    }
    createPetals();

    // Hàm kích hoạt khi bấm chọn chủ đề
    function startQuiz(topicKey) {
        playSound('click');
        currentTopic = [...vocabularyData[topicKey]];
        currentQuestionIndex = 0;
        score = 0;

        document.getElementById('topic-title').innerText = "Chủ đề: " + topicKey.toUpperCase();
        document.getElementById('topic-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function showTopics() {
        playSound('click');
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('topic-screen').style.display = 'block';
    }

    function showQuestion() {
        // Nếu chưa nạp từ vựng, thông báo tạm thời để bạn kiểm tra giao diện bấm nút
        if (currentTopic.length === 0) {
            document.getElementById('question-text').innerText = "Chủ đề này chưa được nạp từ vựng. Hãy gửi danh sách từ để cập nhật nhé! 🐾";
            document.getElementById('options-container').innerHTML = "";
            return;
        }

        if (currentQuestionIndex >= currentTopic.length) {
            document.getElementById('question-text').innerText = "🎉 Bạn đã hoàn thành chủ đề này!";
            document.getElementById('options-container').innerHTML = "";
            return;
        }

        let q = currentTopic[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentTopic.length} | Điểm: ${score}`;

        let optionsHTML = "";
        q.options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}')">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct) {
        let cat1 = document.getElementById('cat1');
        let cat2 = document.getElementById('cat2');

        if (selected === correct) {
            playSound('correct');
            score += 10;
            cat1.innerText = "😸"; cat2.innerText = "😻";
        } else {
            playSound('wrong');
            cat1.innerText = "😿"; cat2.innerText = "😾";
        }

        // Chuyển câu sau 0.6 giây, giữ khung hình đứng yên hoàn toàn không lắc giật
        setTimeout(() => {
            cat1.innerText = "🐱"; cat2.innerText = "😸";
            currentQuestionIndex++;
            showQuestion();
        }, 600);
    }
</script>

</body>
</html>
