<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Reading Vocabulary</title>
    <style>
        :root {
            --primary-color: #ff6b8b;
            --bg-color: #ffeef2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng cánh hoa rơi */
        .petal {
            position: absolute;
            background-color: #ffb6c1;
            border-radius: 150% 0 150% 150%;
            opacity: 0.7;
            pointer-events: none;
            animation: fade 5s infinite linear, float 5s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(80px) rotate(45deg); }
            100% { transform: translateX(0) rotate(90deg); }
        }

        /* Màn hình chọn chủ đề */
        #topic-screen {
            background-color: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 3px solid #ffccd5;
            z-index: 10;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .prompt-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-topic {
            background-color: #fff5f7;
            border: 2px solid #ffe0e6;
            border-radius: 15px;
            padding: 15px 10px;
            font-size: 15px;
            color: #444;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-topic:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: #ff4770;
            transform: translateY(-2px);
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* Màn hình làm bài tập (Ẩn mặc định) */
        #quiz-screen {
            display: none;
            background-color: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 3px solid #ffccd5;
            z-index: 10;
        }

        /* Giữ nguyên các class của phần mèo béo trước đó của bạn */
        .cat-container { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .cat { font-size: 40px; transition: transform 0.3s; }
        .question { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .btn-option { padding: 12px; border: 2px solid #f0f0f0; border-radius: 12px; background-color: #fff; cursor: pointer; font-size: 16px; transition: all 0.2s; font-weight: 500; }
        .btn-option:hover { background-color: #fcf6f7; border-color: var(--primary-color); }
        .score { margin-top: 20px; font-size: 16px; color: #666; }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="topic-screen">
    <h2>Reading Practice 📖</h2>
    <div class="prompt-text">Hôm nay bạn muốn ôn tập từ vựng chủ đề nào? ✨</div>
    
    <div class="topic-grid">
        <button class="btn-topic" onclick="startQuiz('animals')">🐾 Animals</button>
        <button class="btn-topic" onclick="startQuiz('customs')">🎎 Customs & Traditions</button>
        <button class="btn-topic" onclick="startQuiz('history')">📜 History</button>
        <button class="btn-topic" onclick="startQuiz('transport')">🚗 Transport</button>
        <button class="btn-topic" onclick="startQuiz('environment')">🌱 Environment</button>
        <button class="btn-topic" onclick="startQuiz('health')">💪 Health & Fitness</button>
    </div>
    <button class="btn-back" onclick="window.location.href='index.html'">⬅ Quay lại Menu chính</button>
</div>

<div id="quiz-screen">
    <div class="cat-container">
        <div id="cat1" class="cat">🐱</div>
        <div id="cat2" class="cat">😸</div>
    </div>
    <div id="topic-title" style="color: var(--primary-color); font-weight: bold; margin-bottom: 10px;"></div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text">Câu hỏi: 0/0 | Điểm: 0</div>
    <button class="btn-back" onclick="showTopics()">⬅ Đổi chủ đề khác</button>
</div>

<script>
    // KHO TỪ VỰNG 6 CHỦ ĐỀ (Bạn có thể tự thay đổi từ và nghĩa ở đây nhé)
    const vocabularyData = {
        animals: [
            { word: "Predator (n)", mean: "Động vật ăn thịt", options: ["Động vật ăn thịt", "Động vật ăn cỏ", "Thú cưng", "Côn trùng"] },
            { word: "Mammal (n)", mean: "Động vật có vú", options: ["Động vật bò sát", "Động vật có vú", "Loài chim", "Loài cá"] },
            { word: "Extinct (adj)", mean: "Tuyệt chủng", options: ["Quý hiếm", "Hung dữ", "Tuyệt chủng", "Sống về đêm"] }
        ],
        customs: [
            { word: "Tradition (n)", mean: "Truyền thống", options: ["Hiện đại", "Thói quen", "Truyền thống", "Luật pháp"] },
            { word: "Heritage (n)", mean: "Di sản", options: ["Tài sản", "Di sản", "Lễ hội", "Trang phục"] }
        ],
        history: [
            { word: "Century (n)", mean: "Thế kỷ", options: ["Thập kỷ", "Thế kỷ", "Thiên niên kỷ", "Năm"] },
            { word: "Dynasty (n)", mean: "Triều đại", options: ["Chính phủ", "Triều đại", "Chiến tranh", "Hiệp ước"] }
        ],
        transport: [
            { word: "Vehicle (n)", mean: "Phương tiện giao thông", options: ["Phương tiện giao thông", "Hành khách", "Bến xe", "Đường cao tốc"] },
            { word: "Commute (v)", mean: "Đi làm hằng ngày (bằng phương tiện giao thông)", options: ["Du lịch", "Đi bộ", "Đi làm hằng ngày", "Vận chuyển hàng hóa"] }
        ],
        environment: [
            { word: "Pollution (n)", mean: "Sự ô nhiễm", options: ["Sự bảo tồn", "Sự ô nhiễm", "Năng lượng tái tạo", "Hệ sinh thái"] },
            { word: "Greenhouse effect (n)", mean: "Hiệu ứng nhà kính", options: ["Biến đổi khí hậu", "Năng lượng mặt trời", "Hiệu ứng nhà kính", "Mưa axit"] }
        ],
        health: [
            { word: "Nutritious (adj)", mean: "Bổ dưỡng, giàu dinh dưỡng", options: ["Độc hại", "Béo ngậy", "Bổ dưỡng", "Chua chát"] },
            { word: "Workout (n)", mean: "Buổi tập thể dục", options: ["Chế độ ăn kiêng", "Buổi tập thể dục", "Giấc ngủ", "Sự mệt mỏi"] }
        ]
    };

    let currentTopic = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // Phát âm thanh Tinh Tinh / Reng Reng bằng code thuần
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                // Tiếng tinh tinh vui tai khi bấm đúng/chuyển trang
                osc.frequency.setValueAtTime(type === 'correct' ? 1200 : 880, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                // Tiếng reng/bíp trầm khi chọn sai
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        } catch(e) {}
    }

    // Tạo hiệu ứng cánh hoa rơi ngẫu nhiên
    function createPetals() {
        const container = document.getElementById('petal-container');
        for (let i = 0; i < 15; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 12 + 8 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDelay = Math.random() * 5 + 's';
            petal.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(petal);
        }
    }
    createPetals();

    // Bắt đầu làm bài tập theo chủ đề đã chọn
    function startQuiz(topicKey) {
        playSound('click');
        currentTopic = [...vocabularyData[topicKey]];
        // Trộn ngẫu nhiên câu hỏi câu trả lời
        currentTopic.sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0;
        score = 0;

        document.getElementById('topic-title').innerText = "Chủ đề: " + topicKey.toUpperCase();
        document.getElementById('topic-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function showTopics() {
        playSound('click');
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('topic-screen').style.display = 'block';
    }

    function showQuestion() {
        if (currentQuestionIndex >= currentTopic.length) {
            document.getElementById('question-text').innerText = "🎉 Bạn đã hoàn thành chủ đề này!";
            document.getElementById('options-container').innerHTML = "";
            return;
        }

        let q = currentTopic[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentTopic.length} | Điểm: ${score}`;

        let optionsHTML = "";
        // Trộn các lựa chọn đáp án
        let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}')">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct) {
        let cat1 = document.getElementById('cat1');
        let cat2 = document.getElementById('cat2');

        if (selected === correct) {
            playSound('correct');
            score += 10;
            cat1.style.transform = "scale(1.4) rotate(15deg)";
            cat2.style.transform = "scale(1.4) rotate(-15deg)";
            cat1.innerText = "😸"; cat2.innerText = "😻";
        } else {
            playSound('wrong');
            cat1.style.transform = "translateX(-15px)";
            cat2.style.transform = "translateX(15px)";
            cat1.innerText = "😿"; cat2.innerText = "😾";
        }

        // Reset trạng thái mèo sau 0.5 giây và qua câu tiếp theo
        setTimeout(() => {
            cat1.style.transform = "none";
            cat2.style.transform = "none";
            cat1.innerText = "🐱"; cat2.innerText = "😸";
            currentQuestionIndex++;
            showQuestion();
        }, 600);
    }
</script>

</body>
</html>
