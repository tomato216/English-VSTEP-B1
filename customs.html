<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Customs & Traditions</title>
    <style>
        :root {
            --primary-color: #ff8fa3; /* Hồng hoa đào nhạt, dịu mắt */
            --dark-color: #d9383a;    /* Đỏ bao lì xì truyền thống */
            --bg-color: #fff0f2;      /* Nền hồng kem siêu nhẹ, chống mỏi mắt */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng hoa đào rơi nhẹ nhàng ở nền ngày Tết */
        .petal {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 150%;
            opacity: 0.65;
            pointer-events: none;
            animation: fade 6s infinite linear, float 6s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.65; }
            90% { opacity: 0.65; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(50px) rotate(25deg); }
            100% { transform: translateX(0) rotate(50deg); }
        }

        /* Khung chứa giao diện chính hình bao lì xì/hộp quà Tết */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(217, 56, 58, 0.12);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 3px solid #ffccd5;
            z-index: 10;
            position: relative;
        }

        /* Icon ngày Tết đầu trang */
        .tet-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: #333; 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #ffe5e9; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.2s, border-color 0.2s; 
            font-weight: 500; 
            color: #444;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #fff5f6; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #777; 
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* 2 ô vuông lớn ở màn hình kết thúc */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #fff5f6;
            border-color: var(--primary-color);
            color: var(--dark-color);
        }

        .btn-next-topic:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: #ff6b8b;
        }

        .btn-redo-wrong {
            background-color: #fff0f2;
            border-color: #ffb6c1;
            color: #c94c4c;
        }

        .btn-redo-wrong:hover {
            background-color: #d9383a;
            color: white;
            border-color: #b32426;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="quiz-screen" class="main-box">
    <div class="tet-icon">🧧🌸</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 14px;">CHỦ ĐỀ: CUSTOMS & TRADITIONS</div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text"></div>
    <button class="btn-back" onclick="goToMenu()">⬅ Quay lại Menu chính</button>
</div>

<div id="result-screen" class="main-box" style="display: none;">
    <div class="tet-icon">🎉🌸</div>
    <h2>Kết Quả Luyện Tập</h2>
    <div class="question" id="result-summary"></div>
    
    <div class="result-buttons">
        <button class="btn-result btn-next-topic" onclick="goToMenu()">🔄 Đổi sang chủ đề khác</button>
        <button class="btn-result btn-redo-wrong" id="btn-redo" onclick="startRedoWrong()">🔥 Làm lại các câu sai</button>
    </div>
</div>

<script>
    // DATA 35 TỪ VỰNG CHỦ ĐỀ CUSTOMS AND TRADITIONS ĐẦY ĐỦ CHÍNH XÁC
    const vocabularyData = [
        { word: "Shape (v)", mean: "Định hình / Hình thành" },
        { word: "Unique (adj)", mean: "Độc đáo / Duy nhất" },
        { word: "Pass down (v)", mean: "Truyền lại (cho đời sau)" },
        { word: "Maintain (v)", mean: "Duy trì / Gìn giữ" },
        { word: "Cultural heritage (n)", mean: "Di sản văn hóa" },
        { word: "Roots (n)", mean: "Cội nguồn / Gốc rễ" },
        { word: "Honor (v)", mean: "Tôn kính / Vinh danh" },
        { word: "Ancestor (n)", mean: "Tổ tiên" },
        { word: "Worship (n/v)", mean: "Sự thờ cúng / Thờ cúng" },
        { word: "Pray (v)", mean: "Cầu nguyện" },
        { word: "Altar (n)", mean: "Bàn thờ" },
        { word: "Occasion (n)", mean: "Dịp / Cơ hội" },
        { word: "Good fortune (n)", mean: "Sự may mắn / Vận may" },
        { word: "Festivity (n)", mean: "Các hoạt động lễ hội" },
        { word: "Preserve (v)", mean: "Bảo tồn / Gìn giữ" },
        { word: "Identity (n)", mean: "Bản sắc" },
        { word: "Lunar New Year (n)", mean: "Tết Âm lịch" },
        { word: "Family reunion (n)", mean: "Cuộc đoàn tụ gia đình" },
        { word: "Parade (n)", mean: "Cuộc diễu hành" },
        { word: "Greeting (n)", mean: "Lời chào" },
        { word: "Prosperity (n)", mean: "Sự thịnh vượng / Giàu có" },
        { word: "Serve as (v)", mean: "Đóng vai trò như là" },
        { word: "Symbol (n)", mean: "Biểu tượng" },
        { word: "Red envelope (n)", mean: "Bao lì xì đỏ" },
        { word: "Superstition (n)", mean: "Sự mê tín" },
        { word: "Avoid (v)", mean: "Tránh / Né tránh" },
        { word: "Prevent (v)", mean: "Ngăn chặn" },
        { word: "Milestone (n)", mean: "Cột mốc quan trọng" },
        { word: "Ceremony (n)", mean: "Nhi lễ" },
        { word: "Ritual (n)", mean: "Nghi thức" },
        { word: "Funeral (n)", mean: "Đám tang" },
        { word: "Strict (adj)", mean: "Nghiêm ngặt" },
        { word: "Guideline (n)", mean: "Hướng dẫn / Nguyên tắc" },
        { word: "Influence (v)", mean: "Ảnh hưởng / Tác động" },
        { word: "Social behavior (n)", mean: "Hành vi xã hội" }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isRedoMode = false;

    // Phát âm thanh phần cứng: Tinh tinh (Đúng) và Tè tè bíp trầm ngắn (Sai)
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'correct' ? 1050 : 880, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(145, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        } catch(e) {}
    }

    // Hiệu ứng những cánh hoa đào rơi nhẹ lãng mạn nền Tết
    function createPetals() {
        const container = document.getElementById('petal-container');
        for (let i = 0; i < 12; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 10 + 8 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDelay = Math.random() * 6 + 's';
            petal.style.animationDuration = Math.random() * 4 + 5 + 's';
            container.appendChild(petal);
        }
    }
    createPetals();

    // Khởi tạo bài tập xáo trộn ngẫu nhiên câu hỏi
    function initQuiz() {
        currentQuestions = [...vocabularyData].sort(() => Math.random() - 0.5);
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        isRedoMode = false;
        showQuestion();
    }

    function showQuestion() {
        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentQuestions.length} | Đúng: ${score}`;

        // TỰ ĐỘNG TẠO ĐÁP ÁN NHIỄU BỐC NGẪU NHIÊN TỪ KHO TỪ VỰNG
        let options = [q.word];
        let allWords = vocabularyData.map(item => item.word).filter(w => w !== q.word);
        allWords.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 3; i++) {
            if (allWords[i]) options.push(allWords[i]);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHTML = "";
        options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}', this)">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        let q = currentQuestions[currentQuestionIndex];

        if (selected === correct) {
            playSound('correct');
            btn.style.backgroundColor = '#d4edda';
            btn.style.borderColor = '#c3e6cb';
            if (!isRedoMode) score++;
        } else {
            playSound('wrong');
            btn.style.backgroundColor = '#f8d7da';
            btn.style.borderColor = '#f5c6cb';
            if (!wrongQuestions.some(item => item.word === q.word)) {
                wrongQuestions.push(q);
            }
        }

        // Chuyển sang câu tiếp theo đứng yên nhẹ nhàng sau 0.7 giây
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 700);
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let summaryText = "";
        if (isRedoMode) {
            summaryText = `Lượt sửa câu sai hoàn tất! Còn lại <b>${wrongQuestions.length}</b> câu chưa thuộc.`;
        } else {
            summaryText = `Tuyệt vời! Bạn đã hoàn thành bài học với số điểm <b>${score}/${currentQuestions.length}</b> câu đúng.`;
        }
        document.getElementById('result-summary').innerHTML = summaryText;

        let redoBtn = document.getElementById('btn-redo');
        if (wrongQuestions.length === 0) {
            redoBtn.style.display = 'none';
            document.getElementById('result-summary').innerHTML += "<br><span style='color: #28a745; font-weight: bold; font-size: 15px;'>Xuất sắc! Bạn không sai câu nào cả! 🧧🥳</span>";
        } else {
            redoBtn.style.display = 'block';
            redoBtn.innerText = `🔥 Làm lại ${wrongQuestions.length} câu sai`;
        }
    }

    function startRedoWrong() {
        playSound('click');
        currentQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        isRedoMode = true;

        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function goToMenu() {
        playSound('click');
        window.location.href = 'reading.html';
    }

    // Tự động chạy ngay khi mở trang
    initQuiz();
</script>

</body>
</html>
