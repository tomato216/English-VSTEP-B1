<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - History Vocabulary</title>
    <style>
        :root {
            --primary-color: #c2a679; /* Vàng nâu giấy cổ, nhã nhặn và dịu mắt */
            --dark-color: #5c4033;    /* Nâu đất đậm cổ kính */
            --bg-color: #f7f2ea;      /* Nền màu giấy parchment cũ, siêu dịu mắt */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng mảnh giấy cũ rơi nhẹ lãng mạn ở nền */
        .petal {
            position: absolute;
            background-color: #ebdcb9;
            border-radius: 4px;
            opacity: 0.5;
            pointer-events: none;
            animation: fade 7s infinite linear, float 7s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(40px) rotate(45deg); }
            100% { transform: translateX(0) rotate(90deg); }
        }

        /* Khung chứa giao diện chính mang phong cách cổ kính, đơn giản */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(92, 64, 51, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 2px solid #ebdcb9;
            z-index: 10;
            position: relative;
        }

        /* Icon lịch sử cổ điển */
        .history-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
            font-family: 'Georgia', serif; /* Font chữ có chân tạo cảm giác cổ điển */
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: #3e2723; 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #f0e6d2; 
            border-radius: 10px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.2s, border-color 0.2s; 
            font-weight: 500; 
            color: #4e342e;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #faf6ee; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #7d6652; 
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #8d7765;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* Giao diện 2 ô vuông lớn khi kết thúc */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #faf6ee;
            border-color: var(--primary-color);
            color: var(--dark-color);
        }

        .btn-next-topic:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: #b09363;
        }

        .btn-redo-wrong {
            background-color: #fdf2f2;
            border-color: #f5c6cb;
            color: #a94442;
        }

        .btn-redo-wrong:hover {
            background-color: #d9534f;
            color: white;
            border-color: #d43f3a;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<!-- MÀN HÌNH LÀM BÀI TẬP (CỐ ĐỊNH KHÔNG RUNG LẮC) -->
<div id="quiz-screen" class="main-box">
    <div class="history-icon">📜🏛️</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 14px; letter-spacing: 1px; font-family: 'Georgia', serif;">CHỦ ĐỀ: HISTORY</div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text"></div>
    <button class="btn-back" onclick="goToMenu()">⬅ Quay lại Menu chính</button>
</div>

<!-- MÀN HÌNH KẾT THÚC (2 Ô VUÔNG LỰA CHỌN) -->
<div id="result-screen" class="main-box" style="display: none;">
    <div class="history-icon">🏆🏛️</div>
    <h2>Kết Quả Luyện Tập</h2>
    <div class="question" id="result-summary"></div>
    
    <div class="result-buttons">
        <button class="btn-result btn-next-topic" onclick="goToMenu()">🔄 Đổi sang chủ đề khác</button>
        <button class="btn-result btn-redo-wrong" id="btn-redo" onclick="startRedoWrong()">🔥 Làm lại các câu sai</button>
    </div>
</div>

<script>
    // DATA 44 TỪ VỰNG CHỦ ĐỀ HISTORY ĐẦY ĐỦ CHÍNH XÁC KHÔNG THIẾU TỪ NÀO
    const vocabularyData = [
        { word: "Ancient (adj)", mean: "Cổ đại" },
        { word: "Nation (n)", mean: "Quốc gia / Dân tộc" },
        { word: "Century (n)", mean: "Thế kỷ (100 năm)" },
        { word: "Decade (n)", mean: "Thập kỷ (10 năm)" },
        { word: "Historical event (n)", mean: "Sự kiện lịch sử" },
        { word: "Empire (n)", mean: "Đế chế" },
        { word: "Fierce (adj)", mean: "Quyết liệt / Dữ dội" },
        { word: "Battle (n)", mean: "Trận đánh" },
        { word: "Conflict (n)", mean: "Cuộc xung đột" },
        { word: "Soldier (n)", mean: "Người lính" },
        { word: "Homeland (n)", mean: "Quê hương / Tổ quốc" },
        { word: "Struggle (n/v)", mean: "Cuộc đấu tranh / Đấu tranh" },
        { word: "Freedom (n)", mean: "Sự tự do" },
        { word: "Government (n)", mean: "Chính phủ" },
        { word: "Foreign ruler (n)", mean: "Kẻ cai trị nước ngoài" },
        { word: "Political movement (n)", mean: "Phong trào chính trị" },
        { word: "Revolution (n)", mean: "Cuộc cách mạng" },
        { word: "Declare independence (v)", mean: "Tuyên bố độc lập" },
        { word: "Victory (n)", mean: "Chiến thắng" },
        { word: "Tragic defeat (n)", mean: "Sự thất bại bi thảm" },
        { word: "Historical figure (n)", mean: "Nhân vật lịch sử" },
        { word: "War hero (n)", mean: "Anh hùng chiến tranh" },
        { word: "Preserve history (v)", mean: "Bảo tồn lịch sử" },
        { word: "Generation (n)", mean: "Thế hệ" },
        { word: "Monument (n)", mean: "Tượng đài / Đài tưởng niệm" },
        { word: "National flag (n)", mean: "Lá cờ tổ quốc" },
        { word: "Symbol of pride (n)", mean: "Biểu tượng của sự tự hào" },
        { word: "Historical site (n)", mean: "Di tích lịch sử" },
        { word: "Museum (n)", mean: "Bảo tàng" },
        { word: "Display (v)", mean: "Trưng bày" },
        { word: "Ancestor (n)", mean: "Tổ tiên" },
        { word: "Main topic (n)", mean: "Chủ đề chính" },
        { word: "According to (prep)", mean: "Theo như (thông tin trong bài)" },
        { word: "Refers to (v)", mean: "Ám chỉ / Thay thế cho từ nào" },
        { word: "Closest in meaning (adj)", mean: "Gần nghĩa nhất" },
        { word: "Mention (v)", mean: "Nhắc đến / Đề cập" },
        { word: "Not mentioned (adj)", mean: "Không được nhắc đến" },
        { word: "Definition (n)", mean: "Định nghĩa" },
        { word: "Surrender (v)", mean: "Đầu hàng" },
        { word: "Refuse (v)", mean: "Từ chối (làm gì)" },
        { word: "Period (n)", mean: "Giai đoạn / Khoảng thời gian" },
        { word: "Well-known (adj)", mean: "Nổi tiếng / Ai cũng biết (Đồng nghĩa với Famous)" },
        { word: "Unknown (adj)", mean: "Vô danh / Không ai biết" },
        { word: "Dangerous (adj)", mean: "Nguy hiểm" }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isRedoMode = false;

    // Âm thanh phần cứng ngắn gọn, nhẹ nhàng tinh tế
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'correct' ? 950 : 850, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(135, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        } catch(e) {}
    }

    // Hiệu ứng mảnh giấy tài liệu cổ rơi nhẹ ở nền
    function createPetals() {
        const container = document.getElementById('petal-container');
        for (let i = 0; i < 10; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 8 + 8 + 'px';
            petal.style.height = Math.random() * 12 + 10 + 'px';
            petal.style.animationDelay = Math.random() * 6 + 's';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            container.appendChild(petal);
        }
    }
    createPetals();

    function initQuiz() {
        currentQuestions = [...vocabularyData].sort(() => Math.random() - 0.5);
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        isRedoMode = false;
        showQuestion();
    }

    function showQuestion() {
        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentQuestions.length} | Đúng: ${score}`;

        let options = [q.word];
        let allWords = vocabularyData.map(item => item.word).filter(w => w !== q.word);
        allWords.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 3; i++) {
            if (allWords[i]) options.push(allWords[i]);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHTML = "";
        options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}', this)">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        let q = currentQuestions[currentQuestionIndex];

        if (selected === correct) {
            playSound('correct');
            btn.style.backgroundColor = '#e2eed4';
            btn.style.borderColor = '#c3e6cb';
            if (!isRedoMode) score++;
        } else {
            playSound('wrong');
            btn.style.backgroundColor = '#fce8e6';
            btn.style.borderColor = '#f5c6cb';
            if (!wrongQuestions.some(item => item.word === q.word)) {
                wrongQuestions.push(q);
            }
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 700);
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let summaryText = "";
        if (isRedoMode) {
            summaryText = `Lượt ôn tập kết thúc! Bạn còn <b>${wrongQuestions.length}</b> câu chưa thuộc hoàn toàn.`;
        } else {
            summaryText = `Tuyệt vời! Bạn đã vượt qua bài Lịch sử với số điểm <b>${score}/${currentQuestions.length}</b> câu đúng.`;
        }
        document.getElementById('result-summary').innerHTML = summaryText;

        let redoBtn = document.getElementById('btn-redo');
        if (wrongQuestions.length === 0) {
            redoBtn.style.display = 'none';
            document.getElementById('result-summary').innerHTML += "<br><span style='color: #43a047; font-weight: bold; font-size: 15px;'>Ghi danh bảng vàng! Bạn đã thuộc hết 100% từ vựng lịch sử! 🏆📖</span>";
        } else {
            redoBtn.style.display = 'block';
            redoBtn.innerText = `🔥 Làm lại ${wrongQuestions.length} câu sai`;
        }
    }

    function startRedoWrong() {
        playSound('click');
        currentQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        isRedoMode = true;

        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function goToMenu() {
        playSound('click');
        window.location.href = 'reading.html';
    }

    initQuiz();
</script>

</body>
</html>
