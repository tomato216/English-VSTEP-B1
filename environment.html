<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Environment Vocabulary</title>
    <style>
        :root {
            --primary-color: #22c55e; 
            --dark-color: #14532d;    
            --bg-color: #f0fdf4;      
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng lá rơi */
        .petal {
            position: absolute;
            background-color: #bbf7d0;
            border-radius: 100% 0 100% 0; 
            opacity: 0.6;
            pointer-events: none;
            animation: fade 6s infinite linear, float 6s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(45px) rotate(20deg); }
            100% { transform: translateX(0) rotate(40deg); }
        }

        /* Khung giao diện */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(20, 83, 45, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 2px solid #bbf7d0;
            z-index: 10;
            position: relative;
        }

        .env-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: #14532d; 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #f0fdf4; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.15s, border-color 0.15s; 
            font-weight: 500; 
            color: #166534;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #f0fdf4; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #166534; 
            font-weight: bold;
        }

        .bottom-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn-text {
            background: none;
            border: none;
            color: #166534;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            font-weight: bold;
            padding: 5px;
        }
        
        .btn-text:hover {
            color: var(--primary-color);
        }

        /* Nút màn hình kết quả */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .btn-next-topic:hover {
            background-color: #22c55e;
            color: white;
            border-color: #166534;
        }

        .btn-redo-wrong {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .btn-redo-wrong:hover {
            background-color: #ef4444;
            color: white;
            border-color: #991b1b;
        }

        .btn-history-view {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #334155;
        }

        .btn-history-view:hover {
            background-color: #cbd5e1;
            border-color: #94a3b8;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="quiz-screen" class="main-box">
    <div class="env-icon">🌱🌍</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">CHỦ ĐỀ: ENVIRONMENT</div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text"></div>
    
    <div class="bottom-actions">
        <button class="btn-text" onclick="goToMenu()">⬅ Menu chính</button>
        <button class="btn-text" onclick="window.location.href='lich_su.html'">📊 Xem Lịch sử</button>
    </div>
</div>

<div id="result-screen" class="main-box" style="display: none;">
    <div class="env-icon">🌲✨</div>
    <h2>Kết Quả Luyện Tập</h2>
    <div class="question" id="result-summary"></div>
    
    <div class="result-buttons">
        <button class="btn-result btn-next-topic" onclick="goToMenu()">🔄 Đổi sang chủ đề khác</button>
        <button class="btn-result btn-redo-wrong" id="btn-redo" onclick="startRedoWrong()">🔥 Làm lại các câu sai</button>
        <button class="btn-result btn-history-view" onclick="window.location.href='lich_su.html'">📊 Chuyển đến trang Lịch sử</button>
    </div>
</div>

<script>
    const vocabularyData = [
        { word: "Environment (n)", mean: "Môi trường" },
        { word: "Pollution (n)", mean: "Ô nhiễm / Sự ô nhiễm" },
        { word: "Soil (n)", mean: "Đất trồng / Đất mặt" },
        { word: "Climate change (n)", mean: "Biến đổi khí hậu" },
        { word: "Global warming (n)", mean: "Hiện tượng nóng lên toàn cầu" },
        { word: "Greenhouse effect (n)", mean: "Hiệu ứng nhà kính" },
        { word: "Trapped gases (n)", mean: "Các loại khí bị mắc kẹt / Bị giữ lại" },
        { word: "Atmosphere (n)", mean: "Khí quyển / Bầu không khí" },
        { word: "Fossil fuels (n)", mean: "Nhiên liệu hóa thạch" },
        { word: "Coal (n)", mean: "Than đá" },
        { word: "Deforestation (n)", mean: "Nạn phá rừng" },
        { word: "Ecosystem (n)", mean: "Hệ sinh thái" },
        { word: "Biodiversity (n)", mean: "Đa dạng sinh học" },
        { word: "Endangered species (n)", mean: "Loài có nguy cơ tuyệt chủng" },
        { word: "Disappear (v)", mean: "Biến mất" },
        { word: "Emission (n)", mean: "Khí thải / Sự phát thải" },
        { word: "Natural resources (n)", mean: "Tài nguyên thiên nhiên" },
        { word: "Future generations (n)", mean: "Các thế hệ tương lai" },
        { word: "Crisis (n)", mean: "Cuộc khủng hoảng" },
        { word: "Sustainable development (n)", mean: "Phát triển bền vững" },
        { word: "Renewable energy (n)", mean: "Năng lượng tái tạo" },
        { word: "Solar and wind power (n)", mean: "Năng lượng mặt trời và năng lượng gió" },
        { word: "Recycling (n)", mean: "Việc tái chế" },
        { word: "Environment-friendly (adj)", mean: "Thân thiện với môi trường" },
        { word: "Conservation (n)", mean: "Sự bảo tồn" },
        { word: "Daily habits (n)", mean: "Thói quen hàng ngày" },
        { word: "Economy (n)", mean: "Nền kinh tế" },
        { word: "Related to (v)", mean: "Liên quan đến / Có quan hệ với" },
        { word: "Direct result (n)", mean: "Kết quả trực tiếp" },
        { word: "Refers to (v)", mean: "Ám chỉ / Thay thế cho từ nào" },
        { word: "Individual (n)", mean: "Cá nhân / Mỗi người" },
        { word: "Gases released into the air (n)", mean: "Các loại khí thải ra không khí (Đồng nghĩa với Emission)" },
        { word: "Author’s purpose (n)", mean: "Mục đích của tác giả (khi viết bài này)" },
        { word: "Encourage (v)", mean: "Khuyến khích / Động viên" },
        { word: "Complain (v)", mean: "Phàn nàn / Than phiền" },
        { word: "Criticize (v)", mean: "Chỉ trích / Phê bình" },
        { word: "Advertise (v)", mean: "Quảng cáo" }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isRedoMode = false;

    // Hệ thống âm thanh
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'correct' ? 900 : 800, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                osc.start(); osc.stop(ctx.currentTime + 0.18);
            }
        } catch(e) {}
    }

    // Hiệu ứng background
    function createPetals() {
        const container = document.getElementById('petal-container');
        for (let i = 0; i < 10; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 8 + 8 + 'px';
            petal.style.height = Math.random() * 12 + 10 + 'px';
            petal.style.animationDelay = Math.random() * 6 + 's';
            petal.style.animationDuration = Math.random() * 4 + 4 + 's';
            container.appendChild(petal);
        }
    }
    createPetals();

    // Khởi tạo Quiz
    function initQuiz() {
        currentQuestions = [...vocabularyData].sort(() => Math.random() - 0.5);
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        isRedoMode = false;
        showQuestion();
    }

    function showQuestion() {
        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentQuestions.length} | Đúng: ${score}`;

        let options = [q.word];
        let allWords = vocabularyData.map(item => item.word).filter(w => w !== q.word);
        allWords.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 3; i++) {
            if (allWords[i]) options.push(allWords[i]);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHTML = "";
        options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}', this)">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        let q = currentQuestions[currentQuestionIndex];

        if (selected === correct) {
            playSound('correct');
            btn.style.backgroundColor = '#dcfce7';
            btn.style.borderColor = '#86efac';
            if (!isRedoMode) score++;
        } else {
            playSound('wrong');
            btn.style.backgroundColor = '#fee2e2';
            btn.style.borderColor = '#fca5a5';
            if (!wrongQuestions.some(item => item.word === q.word)) {
                wrongQuestions.push(q);
            }
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 700);
    }

    // Xử lý màn hình Kết quả và Lưu Lịch sử
    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let summaryText = "";
        if (isRedoMode) {
            summaryText = `Lượt ôn tập hoàn thành! Còn lại <b>${wrongQuestions.length}</b> từ chưa thuộc kỹ.`;
        } else {
            // Lưu kết quả vào LocalStorage để trang lich_su.html lấy đọc
            saveHistory(score, currentQuestions.length);
            summaryText = `Hoàn thành xuất sắc! Bạn đạt <b>${score}/${currentQuestions.length}</b> câu đúng trong chủ đề Môi trường.`;
        }
        document.getElementById('result-summary').innerHTML = summaryText;

        let redoBtn = document.getElementById('btn-redo');
        if (wrongQuestions.length === 0) {
            redoBtn.style.display = 'none';
            document.getElementById('result-summary').innerHTML += "<br><span style='color: #166534; font-weight: bold; font-size: 15px;'>Trái đất xanh cảm ơn bạn! Bạn thuộc toàn bộ 100% từ vựng! 🟢🌱</span>";
        } else {
            redoBtn.style.display = 'block';
            redoBtn.innerText = `🔥 Làm lại ${wrongQuestions.length} câu sai`;
        }
    }

    function startRedoWrong() {
        playSound('click');
        currentQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        isRedoMode = true;

        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function goToMenu() {
        playSound('click');
        window.location.href = 'reading.html'; 
    }

    // Lưu dữ liệu vào chung 1 key để lich_su.html dễ kiểm soát
    function saveHistory(finalScore, total) {
        // Key này tùy bạn đặt, ở đây mình dùng chung 1 mảng 'vstep_learning_history' 
        // cho tất cả các chủ đề để trang lich_su.html load dễ hơn.
        let history = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
        let now = new Date();
        
        let dateStr = now.toLocaleDateString('vi-VN') + ' - ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
        
        // Đưa lịch sử mới lên đầu với topic cụ thể
        history.unshift({ 
            topic: 'Environment', 
            date: dateStr, 
            score: finalScore, 
            total: total 
        });
        
        // Có thể cấu hình giới hạn lưu trữ (ví dụ 50 hoặc 100 lượt gần nhất)
        if (history.length > 50) history.pop(); 
        
        localStorage.setItem('vstep_learning_history', JSON.stringify(history));
    }

    initQuiz();
</script>

</body>
</html>
