<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Animals Vocabulary</title>
    <style>
        :root {
            --primary-color: #f4b251; /* Vàng hươu cao cổ */
            --dark-color: #8b5a2b;    /* Nâu đất */
            --bg-color: #fdf8f2;      /* Nền kem nhạt ấm áp */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng cánh hoa rơi nhẹ nhàng ở nền */
        .petal {
            position: absolute;
            background-color: #fcdfa8;
            border-radius: 150% 0 150% 150%;
            opacity: 0.6;
            pointer-events: none;
            animation: fade 6s infinite linear, float 6s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(60px) rotate(30deg); }
            100% { transform: translateX(0) rotate(60deg); }
        }

        /* Khung chứa giao diện chính */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(139, 90, 43, 0.15);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 3px solid #fcdfa8;
            z-index: 10;
            position: relative;
        }

        .giraffe-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: #333; 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #f3ebe1; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.15s, border-color 0.15s; 
            font-weight: 500; 
            color: #444;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #fffbf5; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #777; 
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: var(--dark-color);
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* Giao diện 2 ô vuông ở màn hình kết thúc */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #fffbf5;
            border-color: var(--primary-color);
            color: var(--dark-color);
        }

        .btn-next-topic:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-redo-wrong {
            background-color: #fff0f2;
            border-color: #ffb6c1;
            color: #c94c4c;
        }

        .btn-redo-wrong:hover {
            background-color: #ff6b6b;
            color: white;
            border-color: #c94c4c;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<!-- MÀN HÌNH LÀM BÀI TẬP CỐ ĐỊNH (VÀO THẲNG KHÔNG CẦN CHỌN) -->
<div id="quiz-screen" class="main-box">
    <div class="giraffe-icon">🦒✨</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">CHỦ ĐỀ: ANIMALS</div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text"></div>
    <button class="btn-back" onclick="goToMenu()">⬅ Quay lại Menu chính</button>
</div>

<!-- MÀN HÌNH KẾT THÚC (2 LỰA CHỌN Ô VUÔNG LỚN) -->
<div id="result-screen" class="main-box" style="display: none;">
    <div class="giraffe-icon">🎉🦒</div>
    <h2>Kết Quả Luyện Tập</h2>
    <div class="question" id="result-summary"></div>
    
    <div class="result-buttons">
        <button class="btn-result btn-next-topic" onclick="goToMenu()">🔄 Đổi sang chủ đề khác</button>
        <button class="btn-result btn-redo-wrong" id="btn-redo" onclick="startRedoWrong()">🔥 Làm lại các câu sai</button>
    </div>
</div>

<script>
    // DATA TỪ VỰNG CHỦ ĐỀ ANIMALS ĐẦY ĐỦ 42 TỪ
    const vocabularyData = [
        { word: "Species (n)", mean: "Loài / Loài sinh vật" },
        { word: "Biodiversity (n)", mean: "Đa dạng sinh học" },
        { word: "Ecosystem (n)", mean: "Hệ sinh thái" },
        { word: "Predator (n)", mean: "Động vật ăn thịt / Kẻ săn mồi" },
        { word: "Prey (n)", mean: "Con mồi" },
        { word: "Camouflage (n/v)", mean: "Sự ngụy trang / Ngụy trang" },
        { word: "Nocturnal (adj)", mean: "(Hoạt động) về đêm" },
        { word: "Creature (n)", mean: "Sinh vật / Loài vật" },
        { word: "Migration (n)", mean: "Sự di cư" },
        { word: "Habitat (n)", mean: "Môi trường sống tự nhiên" },
        { word: "Jungle (n)", mean: "Rừng nhiệt đới / Rừng rậm" },
        { word: "Endangered (adj)", mean: "Có nguy cơ tuyệt chủng" },
        { word: "Extinction (n)", mean: "Sự tuyệt chủng" },
        { word: "Poaching (n)", mean: "Nạn săn bắn trộm" },
        { word: "Wildlife (n)", mean: "Động vật hoang dã" },
        { word: "Reserve (n)", mean: "Khu bảo tồn" },
        { word: "Conservation (n)", mean: "Sự bảo tồn" },
        { word: "Survive (v)", mean: "Sinh tồn / Sống sót" },
        { word: "Domestic (adj)", mean: "Đã thuần hóa / (Vật nuôi) trong nhà" },
        { word: "Adopt (v)", mean: "Nhận nuôi (thú cưng)" },
        { word: "Loyal (adj)", mean: "Trung thành" },
        { word: "Abandon (v)", mean: "Ruồng bỏ / Bỏ rơi" },
        { word: "Shelter (n)", mean: "Nơi trú ẩn / Trạm cứu hộ" },
        { word: "Dying out (v)", mean: "Dần biến mất / Tuyệt chủng dần" },
        { word: "Owner (n)", mean: "Người chủ / Chủ sở hữu" },
        { word: "Wildlife reserve (n)", mean: "Khu bảo tồn động vật hoang dã" },
        { word: "Differ from (v)", mean: "Khác với" },
        { word: "Refer (v)", mean: "Ám chỉ / Đề cập đến" },
        { word: "Purpose (n)", mean: "Mục đích" },
        { word: "Threats (n)", mean: "Các mối đe dọa / Nguy cơ" },
        { word: "Importance (n)", mean: "Tầm quan trọng" },
        { word: "Vital (adj)", mean: "Cực kỳ quan trọng / Thiết yếu" },
        { word: "Significant (adj)", mean: "Ý nghĩa / Quan trọng / Đáng kể" },
        { word: "End up (v)", mean: "Kết cục là / Cuối cùng thì (rơi vào hoàn cảnh nào đó)" },
        { word: "Government (n)", mean: "Chính phủ" },
        { word: "Situation (n)", mean: "Tình hình / Tình huống" },
        { word: "Disappear (v)", mean: "Biến mất" },
        { word: "Generation (n)", mean: "Thế hệ" },
        { word: "Train (v)", mean: "Huấn luyện / Đào tạo" },
        { word: "Feed (v)", mean: "Cho ăn / Nuôi ăn → fed (vp2)" },
        { word: "Breed (n/v)", mean: "Loài, giống / Nhân giống, chăn nuôi" },
        { word: "Responsibility (n)", mean: "Trách nhiệm" }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isRedoMode = false;

    // Hàm tạo âm thanh tinh tinh (khi đúng) và bíp trầm ngắn (khi sai)
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'correct' ? 1000 : 880, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        } catch(e) {}
    }

    // Tạo hiệu ứng cánh hoa rơi nhẹ nhàng ở nền
    function createPetals() {
        const container = document.getElementById('petal-container');
        for (let i = 0; i < 12; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 10 + 8 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDelay = Math.random() * 6 + 's';
            petal.style.animationDuration = Math.random() * 4 + 5 + 's';
            container.appendChild(petal);
        }
    }
    createPetals();

    function initQuiz() {
        // Trộn ngẫu nhiên câu hỏi ngay khi mở trang
        currentQuestions = [...vocabularyData].sort(() => Math.random() - 0.5);
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        isRedoMode = false;
        showQuestion();
    }

    function showQuestion() {
        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentQuestions.length} | Đúng: ${score}`;

        // Tạo 3 đáp án nhiễu ngẫu nhiên
        let options = [q.word];
        let allWords = vocabularyData.map(item => item.word).filter(w => w !== q.word);
        allWords.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 3; i++) {
            if (allWords[i]) options.push(allWords[i]);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHTML = "";
        options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}', this)">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        let q = currentQuestions[currentQuestionIndex];

        if (selected === correct) {
            playSound('correct');
            btn.style.backgroundColor = '#d4edda';
            btn.style.borderColor = '#c3e6cb';
            if (!isRedoMode) score++;
        } else {
            playSound('wrong');
            btn.style.backgroundColor = '#f8d7da';
            btn.style.borderColor = '#f5c6cb';
            if (!wrongQuestions.some(item => item.word === q.word)) {
                wrongQuestions.push(q);
            }
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 700);
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let summaryText = "";
        if (isRedoMode) {
            summaryText = `Bạn đã hoàn thành lượt sửa câu sai! Còn lại <b>${wrongQuestions.length}</b> câu chưa thuộc.`;
        } else {
            summaryText = `Chúc mừng bạn! Bạn đã hoàn thành chủ đề với số điểm <b>${score}/${currentQuestions.length}</b> câu đúng.`;
        }
        document.getElementById('result-summary').innerHTML = summaryText;

        let redoBtn = document.getElementById('btn-redo');
        if (wrongQuestions.length === 0) {
            redoBtn.style.display = 'none';
            document.getElementById('result-summary').innerHTML += "<br><span style='color: #28a745; font-weight: bold; font-size: 15px;'>Xuất sắc! Bạn đã thuộc lòng toàn bộ từ vựng chủ đề này! 🥳</span>";
        } else {
            redoBtn.style.display = 'block';
            redoBtn.innerText = `🔥 Làm lại ${wrongQuestions.length} câu sai`;
        }
    }

    function startRedoWrong() {
        playSound('click');
        currentQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        isRedoMode = true;

        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function goToMenu() {
        playSound('click');
        window.location.href = 'reading.html';
    }

    // Chạy trò chơi ngay lập tức khi load trang
    initQuiz();
</script>

</body>
</html>
