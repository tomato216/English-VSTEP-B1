<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP Writing - Advantage & Disadvantage Practice</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --dark-color: #0f172a;
            --bg-color: #f8fafc;
            --accent-color: #38bdf8;
            --success-color: #16a34a;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 800px;
            border: 2px solid #e2e8f0;
            box-sizing: border-box;
        }

        .menu-title {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: bold;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-card {
            background-color: #fdfdfd;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px 20px;
            font-size: 16px;
            font-weight: bold;
            color: var(--dark-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-card:hover {
            background-color: #f0f9ff;
            border-color: var(--primary-color);
            transform: translateX(5px);
        }

        .menu-card .topic-meta {
            font-size: 13px;
            color: #64748b;
            font-weight: normal;
            margin-top: 4px;
        }
        
        /* Style mới cho phần hiển thị điểm Cấp 1, Cấp 2 */
        .score-badges {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .btn-top-back {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .prompt-box {
            background-color: #f0f9ff;
            border-left: 5px solid var(--primary-color);
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.5;
        }

        .level-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #e2e8f0;
            padding: 5px;
            border-radius: 10px;
        }

        .level-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #475569;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
        }

        .level-tab.active {
            background-color: white;
            color: var(--dark-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-bottom: none;
            background-color: #f1f5f9;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #475569;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .tab-btn.active {
            background-color: white;
            color: var(--primary-color);
            border-color: #e2e8f0 #e2e8f0 white #e2e8f0;
        }

        .tab-content {
            border: 2px solid #e2e8f0;
            border-radius: 0 0 12px 12px;
            padding: 22px;
            background: white;
            margin-top: -17px;
            margin-bottom: 20px;
            min-height: 250px;
        }

        .text-display {
            line-height: 1.7;
            white-space: pre-line;
            color: #334155;
            font-size: 15px;
        }

        .interactive-workspace {
            line-height: 2.4;
            font-size: 16px;
            color: #0f172a;
            text-align: justify;
        }

        .blank-input {
            width: 80px;
            padding: 2px 5px;
            border: none;
            border-bottom: 2px solid var(--accent-color);
            background-color: #f8fafc;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            color: #b91c1c;
            text-align: center;
            outline: none;
            margin: 0 3px;
        }

        .blank-input:focus {
            background-color: #f0f9ff;
            border-bottom-color: var(--primary-color);
        }

        .sentence-block {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .blank-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #0369a1;
        }

        .review-box {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
            text-align: left;
            line-height: 1.6;
        }

        .level-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            background-color: #64748b;
        }

        .section-header {
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 15px;
            font-size: 16px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }
        
        .sub-text {
            color: #64748b;
            font-style: italic;
            font-size: 13px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
            font-size: 14px;
        }
        th { background-color: #f1f5f9; }
    </style>
</head>
<body>

<div class="main-box">

    <div id="menu-screen">
        <button class="btn-top-back" style="margin-bottom:25px;" onclick="window.location.href='writing.html'">⬅ Quay lại Menu Writing</button>
        <div class="menu-title">Select an Advantage & Disadvantage Topic</div>
        
        <div class="menu-grid" id="menu-grid-container">
            </div>
    </div>


    <div id="study-practice-screen" style="display: none;">
        
        <div class="top-nav">
            <button class="btn-top-back" onclick="backToMainMenu()">⬅ Chọn Chủ Đề Khác</button>
            <div id="level-display-badge" class="level-badge">Đang Xem Học Liệu</div>
        </div>

        <div id="prompt-text-display" class="prompt-box">Đang tải đề bài...</div>

        <div class="level-switcher">
            <button id="lvl-tab-0" class="level-tab active" onclick="changeLevelMode(0)">1. Cấu trúc, Từ nối & Bài mẫu</button>
            <button id="lvl-tab-1" class="level-tab" onclick="changeLevelMode(1)">2. Cấp độ 1</button>
            <button id="lvl-tab-2" class="level-tab" onclick="changeLevelMode(2)">3. Cấp độ 2</button>
        </div>

        <div id="study-zone">
            <div class="tab-container">
                <button id="btn-sub-structure" class="tab-btn active" onclick="switchSubTab('structure')">📐 1. Cấu trúc</button>
                <button id="btn-sub-connectors" class="tab-btn" onclick="switchSubTab('connectors')">🔗 2. Từ nối</button>
                <button id="btn-sub-sample" class="tab-btn" onclick="switchSubTab('sample')">📝 3. Thực hành bài mẫu</button>
            </div>
            
            <div class="tab-content">
                <div id="tab-structure" class="text-display"></div>
                <div id="tab-connectors" class="text-display" style="display:none;"></div>
                <div id="tab-sample" class="text-display" style="display:none;"></div>
            </div>
            <button class="btn-action" onclick="changeLevelMode(1)">Tiến Hành Thực Hành Điền Từ Khuyết (Cấp độ 1) ➔</button>
        </div>

        <div id="practice-zone" style="display: none;">
            <div id="workspace-container" class="interactive-workspace"></div>
            <div id="result-feedback-box" class="review-box" style="display: none;"></div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="btn-submit-practice" class="btn-action" onclick="gradePractice()">Chấm Điểm Bài Làm</button>
                <button id="btn-redo-errors" class="btn-action" style="display:none; background-color: #dc2626;" onclick="redoWrongAnswers()">🔥 Làm Lại Các Câu Sai</button>
            </div>
        </div>
    </div>

</div>

<script>
    // DATASET: Đã bổ sung trường 'meta' để hiển thị text mô tả dưới tiêu đề
    const dataset = [
        {
            topicTitle: "Public Transport",
            meta: "Discuss the benefits and drawbacks of using public transport (money, environment, time, comfort...)",
            prompt: "Write a paragraph (at least 120 words) about the advantages and disadvantages of using public transport.",
            sample: "Using public transport brings both benefits and drawbacks to users. On the one hand, there are some clear benefits. First of all, it helps people save a lot of money. Buying a bus ticket is much cheaper than buying gas for a motorbike or a car. Furthermore, using public transport such as buses or trains can protect the environment because it reduces air pollution. On the other hand, there are several drawbacks. However, it also causes some annoying problems. It often takes more time because you have to wait for the bus. Moreover, public transport is sometimes very crowded and noisy during rush hours. As a result, many people feel tired and uncomfortable. In conclusion, although public transport has some negative points, I believe that its advantages are more significant for our lives.",
            translation: "Việc sử dụng phương tiện giao thông công cộng mang lại cả lợi ích và hạn chế cho người dùng. Một mặt, có những lợi ích rất rõ ràng. Trước hết, nó giúp mọi người tiết kiệm được rất nhiều tiền. Mua một vé xe buýt rẻ hơn nhiều so với việc mua xăng cho xe máy hoặc ô tô. Hơn nữa, việc sử dụng phương tiện công cộng như xe buýt hoặc tàu hỏa có thể bảo vệ môi trường vì nó làm giảm ô nhiễm không khí. Mặt khác, có một vài hạn chế. Tuy nhiên, nó cũng gây ra một số vấn đề phiền toái. Nó thường tốn nhiều thời gian hơn vì bạn phải đợi xe buýt. Hơn nữa, phương tiện công cộng đôi khi rất đông đúc và ồn ào trong giờ cao điểm. Kết quả là, nhiều người cảm thấy mệt mỏi và không thoải mái. Kết luận lại, mặc dù phương tiện công cộng có một số điểm tiêu cực, tôi tin rằng những lợi ích của nó vẫn quan trọng hơn đối với cuộc sống của chúng ta.",
            grammar: `<div class="section-header">Cấu trúc ngữ pháp trọng tâm:</div>
            • <b>Using + N/V-ing + V:</b> Using public transport brings... (Việc sử dụng PTCC mang lại...)<br>
            • <b>both A and B:</b> both benefits and drawbacks (cả lợi ích lẫn tác hại)<br>
            • <b>help + sb + V:</b> It helps people save money. (giúp mọi người tiết kiệm tiền)<br>
            • <b>much + so sánh hơn + than:</b> much cheaper than (rẻ hơn nhiều so với...)<br>
            • <b>because + mệnh đề:</b> because it reduces air pollution (bởi vì nó giảm ô nhiễm...)<br>
            • <b>take + time:</b> It takes more time. (Tốn thời gian)<br>
            • <b>have to + V:</b> you have to wait for the bus (bạn phải chờ xe buýt)<br>
            • <b>feel + adj:</b> feel tired and uncomfortable (cảm thấy mệt mỏi và không thoải mái)`
        },
        {
            topicTitle: "Plastic Bags",
            meta: "Discuss the benefits and drawbacks of using plastic bags in daily life.",
            prompt: "Some people think that using plastic bags is convenient in daily life. Write a paragraph (120–150 words) about the benefits and drawbacks of using plastic bags.",
            sample: "Using plastic bags brings both benefits and drawbacks to people. On the one hand, there are some clear benefits. First of all, plastic bags are cheap and easy to use. People can carry food, clothes, and many other things conveniently. Furthermore, plastic bags are light and can be found in almost every shop or supermarket. On the other hand, there are several drawbacks. However, plastic bags are harmful to the environment because they take a long time to break down. Moreover, many people throw them away carelessly, which causes pollution in rivers, lakes, and streets. As a result, animals and plants may be affected. In conclusion, although plastic bags are convenient, I believe that their negative effects on the environment are more serious.",
            translation: "Việc sử dụng túi nilon mang lại cả lợi ích và tác hại cho con người. Một mặt, có những lợi ích rất rõ ràng. Trước hết, túi nilon rẻ và dễ sử dụng. Mọi người có thể mang theo đồ ăn, quần áo và nhiều thứ khác một cách thuận tiện. Hơn nữa, túi nilon nhẹ và có thể tìm thấy ở hầu hết mọi cửa hàng hoặc siêu thị. Mặt khác, có một số hạn chế. Tuy nhiên, túi nilon có hại cho môi trường vì chúng mất nhiều thời gian để phân hủy. Hơn nữa, nhiều người vứt chúng đi một cách cẩu thả, điều này gây ra ô nhiễm ở sông, hồ và đường phố. Kết quả là, động vật và thực vật có thể bị ảnh hưởng. Kết luận lại, mặc dù túi nilon rất tiện lợi, tôi tin rằng những tác động tiêu cực của chúng đối với môi trường thì nghiêm trọng hơn.",
            grammar: `<div class="section-header">Cấu trúc ngữ pháp trọng tâm:</div>
            • <b>be harmful to + N:</b> plastic bags are harmful to the environment (túi nilon có hại cho môi trường)<br>
            • <b>take + time + to V:</b> they take a long time to break down (chúng mất thời gian dài để phân hủy)<br>
            • <b>throw + N + away:</b> throw them away carelessly (vứt bỏ chúng cẩu thả)<br>
            • <b>cause + N:</b> causes pollution (gây ra ô nhiễm)<br>
            • <b>may + V:</b> may be affected (có thể bị ảnh hưởng)`
        },
        {
            topicTitle: "Keeping Animals in Zoos",
            meta: "Discuss the advantages and disadvantages of keeping wild animals in zoos.",
            prompt: "Many zoos keep wild animals for people to visit. Write a paragraph (120–150 words) about the benefits and drawbacks of keeping animals in zoos.",
            sample: "Keeping animals in zoos brings both benefits and drawbacks. On the one hand, there are some clear benefits. First of all, zoos help protect many rare animals. Some animals can live in a safe place and receive good care from zoo workers. Furthermore, zoos give people a chance to learn more about different kinds of animals and their lives. On the other hand, there are several drawbacks. Animals in zoos do not live in their natural environment. Moreover, some zoos have limited space, so animals may feel bored or unhappy. As a result, they cannot live as freely as they do in the wild. In conclusion, although keeping animals in zoos has some disadvantages, I believe that zoos play an important role in protecting animals and educating people.",
            translation: "Việc nuôi giữ động vật trong sở thú mang lại cả lợi ích và tác hại. Một mặt, có những lợi ích rất rõ ràng. Trước hết, các sở thú giúp bảo vệ nhiều loài động vật quý hiếm. Một số động vật có thể sống ở một nơi an toàn và nhận được sự chăm sóc tốt từ các nhân viên sở thú. Hơn nữa, sở thú cho mọi người cơ hội để tìm hiểu thêm về các loài động vật khác nhau và cuộc sống của chúng. Mặt khác, có một số hạn chế. Động vật trong sở thú không được sống trong môi trường tự nhiên của chúng. Hơn nữa, một số sở thú có không gian hạn chế, vì vậy động vật có thể cảm thấy buồn chán hoặc không hạnh phúc. Kết quả là, chúng không thể sống tự do như khi ở ngoài tự nhiên. Kết luận lại, mặc dù việc nuôi giữ động vật trong sở thú có một số bất lợi, tôi tin rằng sở thú đóng một vai trò quan trọng trong việc bảo vệ động vật và giáo dục con người.",
            grammar: `<div class="section-header">Cấu trúc ngữ pháp trọng tâm:</div>
            • <b>Keeping + N + V:</b> Keeping animals in zoos brings... (Việc nuôi nhốt động vật...)<br>
            • <b>give sb a chance to V:</b> give people a chance to learn more (cho mọi người cơ hội tìm hiểu thêm)<br>
            • <b>as + adv + as:</b> cannot live as freely as they do in the wild (không thể sống tự do như ngoài tự nhiên)<br>
            • <b>play an important role in + V-ing/N:</b> play an important role in protecting animals (đóng vai trò quan trọng trong việc bảo vệ động vật)`
        }
    ];

    const generalStructureContent = `
        <div class="section-header">1. Mở đoạn (chọn 1 trong 3)</div>
        • <b>[Tên chủ đề] has both advantages and disadvantages for our modern lives.</b><br>
        <span class="sub-text">(... có cả lợi ích và tác hại cho cuộc sống hiện đại của chúng ta.)</span><br>
        • <b>There are both positive and negative effects of [Tên chủ đề] on our society.</b><br>
        <span class="sub-text">(Có cả những ảnh hưởng tích cực và tiêu cực của ... đối với xã hội.)</span><br>
        • <b>Using / Doing [Tên chủ đề] brings both benefits and drawbacks to users.</b><br>
        <span class="sub-text">(Việc sử dụng/làm ... mang lại cả lợi ích và hạn chế cho người dùng.)</span><br>

        <div class="section-header">2. Lợi ích (Advantage) (chọn 1 trong 3)</div>
        • <b>On the one hand, there are some clear benefits.</b> <span class="sub-text">(Một mặt, có những lợi ích rất rõ ràng)</span><br>
        • <b>First of all, it brings many advantages.</b> <span class="sub-text">(Trước hết, nó mang lại nhiều điểm tốt.)</span><br>
        • <b>To begin with, we cannot deny its benefits.</b> <span class="sub-text">(Đầu tiên, không thể phủ nhận lợi ích của nó)</span><br>
        • <i>Lấy 1 – 2 câu ví dụ cụ thể</i>

        <div class="section-header">3. Tác hại (Disadvantage) (chọn 1 trong 3)</div>
        • <b>On the other hand, there are several drawbacks.</b> <span class="sub-text">(Mặt khác, có tác hại…)</span><br>
        • <b>However, it also causes serious problems.</b> <span class="sub-text">(Tuy nhiên, nó cũng gây ra vấn đề nghiêm trọng)</span><br>
        • <b>Despite the advantages, it has some negative points.</b> <span class="sub-text">(Bất chấp các lợi ích, nó vẫn có điểm tiêu cực)</span><br>
        • <i>Lấy 1 – 2 câu ví dụ cụ thể</i>

        <div class="section-header">4. Kết đoạn</div>
        • <b>In conclusion, although [Tên chủ đề] is useful, we should reduce using it to protect ourselves.</b><br>
        <span class="sub-text">(Kết luận lại, mặc dù ... hữu ích, chúng ta nên giảm sử dụng nó để bảo vệ chính mình.)</span><br>
        • <b>All in all, despite some drawbacks, I believe that the advantages of [Tên chủ đề] are more significant.</b><br>
        <span class="sub-text">(Tóm lại, bất chấp một vài hạn chế, tôi tin rằng lợi ích của ... vẫn quan trọng hơn.)</span>
    `;

    const generalConnectorsContent = `
        <div class="section-header">Bảng từ nối</div>
        <div class="sub-text">Từ nối đứng đầu câu, sau từ nối là 1 câu đầy đủ</div>
        <table>
            <tr><th>Từ nối</th><th>Nghĩa</th></tr>
            <tr><td><b>Furthermore, / Moreover,</b></td><td>Hơn nữa,...</td></tr>
            <tr><td><b>In addition,</b></td><td>Ngoài ra,</td></tr>
            <tr><td><b>Besides,</b></td><td>Bên cạnh đó,</td></tr>
            <tr><td><b>What is more,</b></td><td>Thêm vào đó,</td></tr>
            <tr><td><b>As a result,</b></td><td>Kết quả là,</td></tr>
            <tr><td><b>However,</b></td><td>Tuy nhiên,</td></tr>
            <tr><td><b>Therefore,</b></td><td>Vì vậy,</td></tr>
            <tr><td><b>Firstly, / First of all, / To begin with,</b></td><td>Đầu tiên là</td></tr>
            <tr><td><b>Last but not least, / Finally,</b></td><td>Cuối cùng là</td></tr>
            <tr><td><b>For example, / For instance,</b></td><td>Ví dụ như</td></tr>
            <tr><td><b>S + V + such as / like + N</b></td><td>Lấy ví dụ (Chẳng hạn như...)</td></tr>
        </table>
    `;

    let currentTopicIndex = 0;
    let currentLevel = 0; 
    let level1BlanksData = []; 
    let level2LinesData = [];  
    let wrongPool = [];        

    // =========================================================================
    // CODE RENDER MENU MỚI & LẤY ĐIỂM CAO NHẤT
    // =========================================================================

    // Hàm giả lập tính số lượng câu/từ khuyết tối đa dựa theo nội dung
    function calculateMaxes(text) {
        // Cấp 1 (Tính số từ)
        let tokens = text.split(/(\s+)/);
        let validPositions = [];
        tokens.forEach((token, idx) => {
            if(/[a-zA-Z]/.test(token) && token.trim().length > 2) validPositions.push(idx);
        });
        
        let possibleIndices = [];
        let lastPickedIdx = -5;
        for(let i = 0; i < validPositions.length; i++) {
            let currentTokenIdx = validPositions[i];
            if (currentTokenIdx - lastPickedIdx > 2) {
                possibleIndices.push(currentTokenIdx);
                lastPickedIdx = currentTokenIdx;
            }
        }
        let maxLevel1 = Math.min(15, possibleIndices.length); // Tối đa 15 chỗ trống

        // Cấp 2 (Tính số câu dài > 10 kí tự)
        let sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
        let sentenceIndices = [];
        sentences.forEach((s, i) => { if(s.trim().length > 10) sentenceIndices.push(i); });
        let maxLevel2 = Math.ceil(sentenceIndices.length * 0.45); // Lấy 45% số câu

        return { maxLevel1, maxLevel2 };
    }

    // Hàm lấy điểm cao nhất từ localStorage
    function getBestScore(topicTitle, levelName, maxScore) {
        let history = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
        let bestCorrect = 0;
        
        let filtered = history.filter(h => h.chuDe === topicTitle && h.capDo === levelName);
        filtered.forEach(log => {
            if(log.diemSo) {
                let correct = parseInt(log.diemSo.split('/')[0]);
                if(correct > bestCorrect) bestCorrect = correct;
            }
        });
        
        return `${bestCorrect}/${maxScore}`;
    }

    // Sinh HTML giao diện Menu
    function renderMenu() {
        let menuContainer = document.getElementById('menu-grid-container');
        let htmlContent = '';
        
        dataset.forEach((data, index) => {
            let maxes = calculateMaxes(data.sample);
            let scoreLvl1 = getBestScore(data.topicTitle, "Cấp độ 1 (Điền từ)", maxes.maxLevel1);
            let scoreLvl2 = getBestScore(data.topicTitle, "Cấp độ 2 (Điền câu)", maxes.maxLevel2);
            
            htmlContent += `
            <div class="menu-card" onclick="openTopic(${index})">
                <div>
                    <div>${index + 1}. ${data.topicTitle}</div>
                    <div class="topic-meta">${data.meta}</div>
                    <div class="score-badges">
                        <span style="color: #eab308;">⭐ Cấp 1: ${scoreLvl1}</span> | 
                        <span style="color: #10b981;">🏆 Cấp 2: ${scoreLvl2}</span>
                    </div>
                </div>
                <span style="font-size: 20px;">➔</span>
            </div>
            `;
        });
        
        menuContainer.innerHTML = htmlContent;
    }

    // Chạy khi khởi động trang
    window.onload = function() {
        renderMenu();
    };

    // =========================================================================

    function openTopic(index) {
        currentTopicIndex = index;
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('study-practice-screen').style.display = 'block';
        changeLevelMode(0); 
    }

    function backToMainMenu() {
        document.getElementById('study-practice-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'block';
        renderMenu(); // Load lại menu để cập nhật điểm mới nhất
    }

    function switchSubTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(tabName === 'structure') document.getElementById('btn-sub-structure').classList.add('active');
        if(tabName === 'connectors') document.getElementById('btn-sub-connectors').classList.add('active');
        if(tabName === 'sample') document.getElementById('btn-sub-sample').classList.add('active');

        document.getElementById('tab-structure').style.display = tabName === 'structure' ? 'block' : 'none';
        document.getElementById('tab-connectors').style.display = tabName === 'connectors' ? 'block' : 'none';
        document.getElementById('tab-sample').style.display = tabName === 'sample' ? 'block' : 'none';
    }

    function changeLevelMode(levelNum) {
        currentLevel = levelNum;
        document.querySelectorAll('.level-tab').forEach((tab, idx) => {
            if(idx === levelNum) tab.classList.add('active');
            else tab.classList.remove('active');
        });

        let data = dataset[currentTopicIndex];
        document.getElementById('prompt-text-display').innerText = data.prompt;

        if(levelNum === 0) {
            document.getElementById('level-display-badge').innerText = "Đang Học Lý Thuyết";
            document.getElementById('level-display-badge').style.backgroundColor = '#64748b';
            
            document.getElementById('tab-structure').innerHTML = generalStructureContent;
            document.getElementById('tab-connectors').innerHTML = generalConnectorsContent;
            
            document.getElementById('tab-sample').innerHTML = `
                <div style="font-weight:bold; color:var(--dark-color); margin-bottom:8px;">Bài mẫu:</div>
                <div style="background:#f8fafc; padding:15px; border-radius:8px; line-height:1.6; border:1px solid #cbd5e1; margin-bottom:15px;">${data.sample}</div>
                <div style="font-weight:bold; color:var(--dark-color); margin-bottom:8px;">Bản dịch:</div>
                <div style="background:#fcf8f2; padding:15px; border-radius:8px; line-height:1.6; border:1px solid #e6ccb2; color:#475569; margin-bottom:15px; font-style:italic;">${data.translation}</div>
                ${data.grammar}
            `;
            
            document.getElementById('study-zone').style.display = 'block';
            document.getElementById('practice-zone').style.display = 'none';
            switchSubTab('structure');
        } else if(levelNum === 1) {
            startLevel1();
        } else if(levelNum === 2) {
            startLevel2();
        }
    }

    function startLevel1(forceWords = null) {
        document.getElementById('level-display-badge').innerText = "2. Cấp độ 1";
        document.getElementById('level-display-badge').style.backgroundColor = '#0284c7';
        document.getElementById('study-zone').style.display = 'none';
        document.getElementById('practice-zone').style.display = 'block';
        
        let text = dataset[currentTopicIndex].sample;
        let tokens = text.split(/(\s+)/); 
        let chosenIndices = [];

        if(forceWords) {
            chosenIndices = forceWords;
        } else {
            let validPositions = [];
            tokens.forEach((token, idx) => {
                if(/[a-zA-Z]/.test(token) && token.trim().length > 2) validPositions.push(idx);
            });

            let possibleIndices = [];
            let lastPickedIdx = -5;
            for(let i = 0; i < validPositions.length; i++) {
                let currentTokenIdx = validPositions[i];
                if (currentTokenIdx - lastPickedIdx > 2) {
                    possibleIndices.push(currentTokenIdx);
                    lastPickedIdx = currentTokenIdx;
                }
            }
            possibleIndices.sort(() => Math.random() - 0.5);
            chosenIndices = possibleIndices.slice(0, Math.min(15, possibleIndices.length));
        }

        level1BlanksData = [];
        let htmlContent = "";

        tokens.forEach((token, idx) => {
            if(chosenIndices.includes(idx)) {
                let cleanWord = token.replace(/[^a-zA-Z]/g, "");
                level1BlanksData.push({
                    index: idx,
                    correctClean: cleanWord.toLowerCase().trim(),
                    originalToken: token
                });

                let placeholderStr = `(${level1BlanksData.length})`;
                let inputHTML = token.replace(cleanWord, `<input type="text" class="blank-input" data-blankidx="${level1BlanksData.length - 1}" placeholder="${placeholderStr}">`);
                htmlContent += inputHTML;
            } else {
                htmlContent += token;
            }
        });

        document.getElementById('workspace-container').innerHTML = htmlContent;
        document.getElementById('result-feedback-box').style.display = 'none';
        document.getElementById('btn-redo-errors').style.display = 'none';
        document.getElementById('btn-submit-practice').style.display = 'block';
    }

    function startLevel2(forceLines = null) {
        document.getElementById('level-display-badge').innerText = "3. Cấp độ 2";
        document.getElementById('level-display-badge').style.backgroundColor = '#16a34a';
        document.getElementById('study-zone').style.display = 'none';
        document.getElementById('practice-zone').style.display = 'block';
        
        let text = dataset[currentTopicIndex].sample;
        let sentences = text.split(/(?<=[.!?])\s+/);
        sentences = sentences.filter(s => s.trim().length > 0);

        let chosenLineIndices = [];
        if(forceLines) {
            chosenLineIndices = forceLines;
        } else {
            let sentenceIndices = [];
            sentences.forEach((s, i) => { if(s.trim().length > 10) sentenceIndices.push(i); });
            sentenceIndices.sort(() => Math.random() - 0.5);
            let maxL2 = Math.ceil(sentenceIndices.length * 0.45);
            chosenLineIndices = sentenceIndices.slice(0, maxL2);
        }

        level2LinesData = [];
        let htmlContent = "";

        sentences.forEach((sentence, idx) => {
            if(chosenLineIndices.includes(idx)) {
                level2LinesData.push({
                    index: idx,
                    correctText: sentence.trim(),
                    cleanText: sentence.replace(/[^a-zA-Z0-9]/g, "").toLowerCase().trim()
                });
                
                htmlContent += `<div class="sentence-block">
                    <span style="font-size:13px; color:var(--primary-color); font-weight:bold;">[Gõ lại câu khuyết (${level2LinesData.length})]:</span>
                    <textarea class="blank-textarea" rows="2" data-lineidx="${level2LinesData.length - 1}" placeholder="Nhập lại toàn bộ câu này..."></textarea>
                </div>`;
            } else {
                htmlContent += `<p style="margin:5px 0; display:inline;">${sentence} </p>`;
            }
        });

        document.getElementById('workspace-container').innerHTML = htmlContent;
        document.getElementById('result-feedback-box').style.display = 'none';
        document.getElementById('btn-redo-errors').style.display = 'none';
        document.getElementById('btn-submit-practice').style.display = 'block';
    }

    function gradePractice() {
        let feedbackHTML = "";
        let correctCount = 0;
        let totalCount = 0; 
        wrongPool = [];

        if(currentLevel === 1) {
            let inputs = document.querySelectorAll('.blank-input');
            totalCount = level1BlanksData.length;
            inputs.forEach(input => {
                let bIdx = parseInt(input.getAttribute('data-blankidx'));
                let target = level1BlanksData[bIdx];
                let userVal = input.value.replace(/[^a-zA-Z]/g, "").toLowerCase().trim();

                if(userVal === target.correctClean) {
                    correctCount++;
                    input.style.backgroundColor = '#d1fae5';
                    input.style.borderColor = '#10b981';
                } else {
                    input.style.backgroundColor = '#fee2e2';
                    input.style.borderColor = '#ef4444';
                    wrongPool.push(target.index);
                }
            });

            feedbackHTML = `<b>Kết quả chấm điểm:</b> Đúng <b>${correctCount}/${totalCount}</b> từ.<br>`;
            if(wrongPool.length > 0) {
                feedbackHTML += `<span style="color:#b91c1c;">Hãy nhấn nút đỏ bên dưới để điền lại những từ chưa chính xác.</span>`;
                document.getElementById('btn-redo-errors').style.display = 'block';
            } else {
                feedbackHTML += `<span style="color:#15803d; font-weight:bold;">Tuyệt vời! Bạn đã hoàn thành đúng 100% từ khuyết! 🎉</span>`;
                document.getElementById('btn-redo-errors').style.display = 'none';
            }
        } 
        else if(currentLevel === 2) {
            let textareas = document.querySelectorAll('.blank-textarea');
            totalCount = level2LinesData.length;
            textareas.forEach(box => {
                let lIdx = parseInt(box.getAttribute('data-lineidx'));
                let target = level2LinesData[lIdx];
                let userVal = box.value.replace(/[^a-zA-Z0-9]/g, "").toLowerCase().trim();

                if(userVal === target.cleanText) {
                    correctCount++;
                    box.style.backgroundColor = '#d1fae5';
                    box.style.borderColor = '#10b981';
                } else {
                    box.style.backgroundColor = '#fee2e2';
                    box.style.borderColor = '#ef4444';
                    wrongPool.push(target.index);
                }
            });

            feedbackHTML = `<b>Kết quả chấm điểm:</b> Đúng <b>${correctCount}/${totalCount}</b> câu.<br>`;
            if(wrongPool.length > 0) {
                feedbackHTML += `<div style="margin-top:10px; font-size:14px; color:#0f172a;"><b>Đáp án gợi ý xem lại:</b><br>`;
                level2LinesData.forEach((item, i) => {
                    if(wrongPool.includes(item.index)) {
                        feedbackHTML += `• Ô số (${i+1}): <span style="color:#16a34a; font-weight:bold;">"${item.correctText}"</span><br>`;
                    }
                });
                feedbackHTML += `</div>`;
                document.getElementById('btn-redo-errors').style.display = 'block';
            } else {
                feedbackHTML += `<span style="color:#15803d; font-weight:bold;">Tuyệt đỉnh! Bạn đã thuộc và gõ lại đúng toàn bộ các câu khuyết! 🏆</span>`;
                document.getElementById('btn-redo-errors').style.display = 'none';
            }
        }

        let fBox = document.getElementById('result-feedback-box');
        fBox.innerHTML = feedbackHTML;
        fBox.style.display = 'block';

        // LƯU KẾT QUẢ VÀO LOCALSTORAGE
        try {
            let lichSuHeThong = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let ketQuaMoi = {
                kyNang: "Writing",
                chuDe: (dataset[currentTopicIndex].topicTitle || "Advantage/Disadvantage Topic"),
                capDo: currentLevel === 1 ? "Cấp độ 1 (Điền từ)" : "Cấp độ 2 (Điền câu)",
                diemSo: `${correctCount}/${totalCount}`,
                thoiGian: new Date().toLocaleString('vi-VN')
            };
            lichSuHeThong.unshift(ketQuaMoi);
            localStorage.setItem('vstep_learning_history', JSON.stringify(lichSuHeThong));
        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

    function redoWrongAnswers() {
        if(wrongPool.length === 0) return;
        let originalWrong = [...wrongPool];
        if(currentLevel === 1) {
            startLevel1(originalWrong);
        } else if(currentLevel === 2) {
            startLevel2(originalWrong);
        }
        document.getElementById('btn-redo-errors').style.display = 'none';
    }
</script>
