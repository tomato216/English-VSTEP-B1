<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Health & Fitness Vocabulary</title>
    <style>
        :root {
            --primary-color: #ff6b6b; /* Hồng đỏ energetic, tràn đầy sức sống */
            --dark-color: #7a1b1b;    /* Đỏ mận đậm chín chắn */
            --bg-color: #fff5f5;      /* Nền hồng đào siêu nhẹ, dịu mắt và ấm áp */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng các điểm sáng năng lượng rơi nhẹ nhàng ở phông nền */
        .petal {
            position: absolute;
            background-color: #ffc9c9;
            border-radius: 50%;
            opacity: 0.6;
            pointer-events: none;
            animation: fade 5s infinite linear, float 5s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0); }
            50% { transform: translateX(40px); }
            100% { transform: translateX(0); }
        }

        /* Khung chứa giao diện chính của bài học */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(122, 27, 27, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 2px solid #ffc9c9;
            z-index: 10;
            position: relative;
        }

        /* Icon sức khỏe và thể thao */
        .health-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: #7a1b1b; 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #fff5f5; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.15s, border-color 0.15s; 
            font-weight: 500; 
            color: #9c2c2c;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #fff5f5; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #9c2c2c; 
            font-weight: bold;
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #9c2c2c;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            font-weight: bold;
        }
        
        .btn-back:hover {
            color: var(--primary-color);
        }

        /* Khung chứa nút kết quả ở màn hình cuối */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #fff5f5;
            border-color: #ffc9c9;
            color: #9c2c2c;
        }

        .btn-next-topic:hover {
            background-color: #ff6b6b;
            color: white;
            border-color: #7a1b1b;
        }

        .btn-redo-wrong {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .btn-redo-wrong:hover {
            background-color: #ef4444;
            color: white;
            border-color: #991b1b;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="quiz-screen" class="main-box">
    <div class="health-icon">💪🥗</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">CHỦ ĐỀ: HEALTH & FITNESS</div>
    <div class="question" id="question-text">Đang tải câu hỏi...</div>
    <div class="options" id="options-container"></div>
    <div class="score" id="score-text"></div>
    <button class="btn-back" onclick="goToMenu()">⬅ Quay lại Menu chính</button>
</div>

<div id="result-screen" class="main-box" style="display: none;">
    <div class="health-icon">🏅✨</div>
    <h2>Kết Quả Luyện Tập</h2>
    <div class="question" id="result-summary"></div>
    
    <div class="result-buttons">
        <button class="btn-result btn-next-topic" onclick="goToMenu()">🔄 Đổi sang chủ đề khác</button>
        <button class="btn-result btn-redo-wrong" id="btn-redo" onclick="startRedoWrong()">🔥 Làm lại các câu sai</button>
    </div>
</div>

<script>
    // DATA TỪ VỰNG CHỦ ĐỀ HEALTH & FITNESS
    const vocabularyData = [
        { word: "Health (n)", mean: "Sức khỏe" },
        { word: "Fitness (n)", mean: "Sự cân đối / Thể hình / Thể lực tốt" },
        { word: "Healthy (adj)", mean: "Khỏe mạnh / Lành mạnh" },
        { word: "Lifestyle (n)", mean: "Lối sống / Phong cách sống" },
        { word: "Diet (n)", mean: "Chế độ ăn kiêng / Chế độ ăn uống hàng ngày" },
        { word: "Balanced diet (n)", mean: "Chế độ ăn uống cân bằng / Hợp lý" },
        { word: "Nutrition (n)", mean: "Dinh dưỡng / Sự dinh dưỡng" },
        { word: "Nutritious (adj)", mean: "Bổ dưỡng / Giàu dinh dưỡng" },
        { word: "Nutrient (n)", mean: "Chất dinh dưỡng" },
        { word: "Vitamin (n)", mean: "Vitamin" },
        { word: "Mineral (n)", mean: "Khoáng chất" },
        { word: "Protein (n)", mean: "Chất đạm" },
        { word: "Carbohydrate (n)", mean: "Chất bột đường" },
        { word: "Fat (n)", mean: "Chất béo" },
        { word: "Fiber (n)", mean: "Chất xơ" },
        { word: "Calorie (n)", mean: "Calo (đơn vị năng lượng)" },
        { word: "Consume (v)", mean: "Tiêu thụ / Ăn uống vào" },
        { word: "Consumption (n)", mean: "Sự tiêu thụ" },
        { word: "Obese (adj)", mean: "Béo phì" },
        { word: "Obesity (n)", mean: "Bệnh béo phì" },
        { word: "Overweight (adj)", mean: "Thừa cân" },
        { word: "Underweight (adj)", mean: "Thiếu cân" },
        { word: "Exercise (v/n)", mean: "Tập thể dục / Bài tập thể dục" },
        { word: "Workout (n)", mean: "Buổi tập thể hình / Luyện tập thể lực" },
        { word: "Gym (n)", mean: "Phòng tập thể dục" },
        { word: "Physical activity (n)", mean: "Hoạt động thể chất" },
        { word: "Mental health (n)", mean: "Sức khỏe tinh thần" },
        { word: "Stress (n)", mean: "Căng thẳng / Áp lực" },
        { word: "Anxiety (n)", mean: "Sự lo lắng / Cảm giác bất an" },
        { word: "Depression (n)", mean: "Bệnh trầm cảm / Sự suy sụp" },
        { word: "Symptom (n)", mean: "Triệu chứng (bệnh)" },
        { word: "Disease (n)", mean: "Bệnh tật / Căn bệnh" },
        { word: "Illness (n)", mean: "Sự đau ốm / Bệnh tật" },
        { word: "Infection (n)", mean: "Sự nhiễm trùng / Sự lây nhiễm" },
        { word: "Immune system (n)", mean: "Hệ miễn dịch" },
        { word: "Prevent (v)", mean: "Ngăn chặn / Phòng ngừa" },
        { word: "Prevention (n)", mean: "Sự phòng ngừa / Biện pháp ngăn chặn" },
        { word: "Treatment (n)", mean: "Sự điều trị / Phác đồ chữa bệnh" },
        { word: "Cure (v/n)", mean: "Chữa khỏi / Phương thuốc chữa trị" },
        { word: "Medicine (n)", mean: "Thuốc (chữa bệnh) / Y học" },
        { word: "Patient (n)", mean: "Bệnh nhân" },
        { word: "Doctor (n)", mean: "Bác sĩ" },
        { word: "Nurse (n)", mean: "Y tá" },
        { word: "Hospital (n)", mean: "Bệnh viện" },
        { word: "Clinic (n)", mean: "Phòng khám" },
        { word: "Check-up (n)", mean: "Cuộc kiểm tra sức khỏe định kỳ" },
        { word: "Prescription (n)", mean: "Đơn thuốc / Toa thuốc bác sĩ kê" },
        { word: "Energy (n)", mean: "Năng lượng" },
        { word: "Energetic (adj)", mean: "Tràn đầy năng lượng / Mạnh mẽ" },
        { word: "Stamina (n)", mean: "Sức chịu đựng / Sức bền dẻo dai" }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isRedoMode = false;

    // Bộ phát âm thanh hardware an toàn, chống crash trang
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click' || type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(type === 'correct' ? 950 : 850, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                osc.start(); osc.stop(ctx.currentTime + 0.18);
            }
        } catch(e) {}
    }

    // Hiệu ứng hạt năng lượng phông nền sinh động
    function createPetals() {
        try {
            const container = document.getElementById('petal-container');
            if (!container) return;
            for (let i = 0; i < 10; i++) {
                let petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                let size = Math.random() * 8 + 6 + 'px';
                petal.style.width = size;
                petal.style.height = size;
                petal.style.animationDelay = Math.random() * 5 + 's';
                petal.style.animationDuration = Math.random() * 3 + 4 + 's';
                container.appendChild(petal);
            }
        } catch(e) {}
    }

    function initQuiz() {
        try {
            currentQuestions = [...vocabularyData].sort(() => Math.random() - 0.5);
            wrongQuestions = [];
            currentQuestionIndex = 0;
            score = 0;
            isRedoMode = false;
            showQuestion();
        } catch(e) {
            alert("Đã xảy ra lỗi khởi tạo câu hỏi, vui lòng tải lại trang.");
        }
    }

    function showQuestion() {
        if (currentQuestions.length === 0 || !currentQuestions[currentQuestionIndex]) return;

        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Từ nào có nghĩa là: "${q.mean}"?`;
        document.getElementById('score-text').innerText = `Câu hỏi: ${currentQuestionIndex + 1}/${currentQuestions.length} | Đúng: ${score}`;

        let options = [q.word];
        let allWords = vocabularyData.map(item => item.word).filter(w => w !== q.word);
        allWords.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 3; i++) {
            if (allWords[i]) options.push(allWords[i]);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHTML = "";
        options.forEach(opt => {
            optionsHTML += `<button class="btn-option" onclick="checkAnswer('${opt}', '${q.word}', this)">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        let q = currentQuestions[currentQuestionIndex];

        if (selected === correct) {
            playSound('correct');
            btn.style.backgroundColor = '#f0fdf4';
            btn.style.borderColor = '#86efac';
            if (!isRedoMode) score++;
        } else {
            playSound('wrong');
            btn.style.backgroundColor = '#fef2f2';
            btn.style.borderColor = '#fca5a5';
            if (!wrongQuestions.some(item => item.word === q.word)) {
                wrongQuestions.push(q);
            }
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 700);
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let summaryText = "";
        if (isRedoMode) {
            summaryText = `Vòng ôn tập hoàn tất! Bạn còn lại <b>${wrongQuestions.length}</b> từ chưa thuộc vững.`;
        } else {
            // ĐỒNG BỘ KẾT QUẢ SANG NHẬT KÝ HỌC TẬP CHUẨN
            saveToLearningHistory(score, currentQuestions.length);
            summaryText = `Thành tích tuyệt vời! Bạn trả lời đúng <b>${score}/${currentQuestions.length}</b> từ vựng về Sức khỏe & Thể thao.`;
        }
        document.getElementById('result-summary').innerHTML = summaryText;

        let redoBtn = document.getElementById('btn-redo');
        if (wrongQuestions.length === 0) {
            redoBtn.style.display = 'none';
            document.getElementById('result-summary').innerHTML += "<br><span style='color: #22c55e; font-weight: bold; font-size: 15px;'>🥇 Thật phi thường! Bạn đã thuộc làu 100% từ vựng chủ đề này! 🌱🏋️</span>";
        } else {
            redoBtn.style.display = 'block';
            redoBtn.innerText = `🔥 Làm lại ${wrongQuestions.length} câu sai`;
        }
    }

    function startRedoWrong() {
        playSound('click');
        currentQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        isRedoMode = true;

        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
    }

    function goToMenu() {
        playSound('click');
        window.location.href = 'reading.html';
    }

    // HÀM GHI NHẬT KÝ LIÊN KẾT ĐA NĂNG
    function saveToLearningHistory(finalScore, totalQuestions) {
        try {
            let history = JSON.parse(localStorage.getItem('vstep_learning_history')) || [];
            let now = new Date();
            
            let dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            
            // Đóng gói mảng kép linh hoạt phòng ngừa mọi trường hợp đọc dữ liệu
            history.unshift({
                date: dateStr,
                thoiGian: dateStr,
                skill: 'Reading',
                kyNang: 'Reading',
                topic: 'Health & Fitness',
                chuDe: 'Health & Fitness',
                type: 'Trắc nghiệm từ vựng',
                capDo: 'Trắc nghiệm từ vựng',
                score: finalScore,
                total: totalQuestions,
                diemSo: `${finalScore}/${totalQuestions}`
            });
            
            if (history.length > 50) history.pop();
            localStorage.setItem('vstep_learning_history', JSON.stringify(history));
        } catch(e) {
            console.log("Không thể truy cập localStorage");
        }
    }

    window.onload = function() {
        createPetals();
        initQuiz();
    };
</script>

</body>
</html>
