<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP B1 - Health & Fitness Vocabulary</title>
    <style>
        :root {
            --primary-color: #ff6b6b; /* Hồng đỏ energetic, tràn đầy sức sống */
            --dark-color: #7a1b1b;    /* Đỏ mận đậm chín chắn */
            --bg-color: #fff5f5;      /* Nền hồng đào siêu nhẹ, dịu mắt và ấm áp */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng các điểm sáng năng lượng rơi nhẹ nhàng ở phông nền */
        .petal {
            position: absolute;
            background-color: #ffc9c9;
            border-radius: 50%;
            opacity: 0.6;
            pointer-events: none;
            animation: fade 5s infinite linear, float 5s infinite ease-in-out;
        }

        @keyframes fade {
            0% { top: -10px; opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateX(0); }
            50% { transform: translateX(40px); }
            100% { transform: translateX(0); }
        }

        /* Khung chứa giao diện chính của bài học */
        .main-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(122, 27, 27, 0.06);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 2px solid #ffc9c9;
            z-index: 10;
            position: relative;
        }

        /* Icon sức khỏe và thể thao */
        .health-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-color);
            margin: 5px 0;
            font-size: 24px;
        }

        .question { 
            font-size: 19px; 
            font-weight: bold; 
            color: #7a1b1b; 
            margin: 25px 0 20px 0; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn-option { 
            padding: 14px; 
            border: 2px solid #fff5f5; 
            border-radius: 12px; 
            background-color: #fff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.15s, border-color 0.15s; 
            font-weight: 500; 
            color: #9c2c2c;
            text-align: center;
        }

        .btn-option:hover { 
            background-color: #fff5f5; 
            border-color: var(--primary-color); 
        }

        .score { 
            margin-top: 20px; 
            font-size: 15px; 
            color: #9c2c2c; 
            font-weight: bold;
        }

        .bottom-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn-text {
            background: none;
            border: none;
            color: #9c2c2c;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            font-weight: bold;
            padding: 5px;
        }
        
        .btn-text:hover {
            color: var(--primary-color);
        }

        /* Khung chứa nút kết quả ở màn hình cuối */
        .result-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-result {
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn-next-topic {
            background-color: #fff5f5;
            border-color: #ffc9c9;
            color: #9c2c2c;
        }

        .btn-next-topic:hover {
            background-color: #ff6b6b;
            color: white;
            border-color: #7a1b1b;
        }

        .btn-redo-wrong {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .btn-redo-wrong:hover {
            background-color: #ef4444;
            color: white;
            border-color: #991b1b;
        }

        .btn-history-view {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #334155;
        }

        .btn-history-view:hover {
            background-color: #cbd5e1;
            border-color: #94a3b8;
        }

        /* Giao diện Lịch sử */
        .history-list {
            margin-top: 20px;
            max-height: 280px;
            overflow-y: auto;
            text-align: left;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: #fff5f5; border-radius: 10px; }
        .history-list::-webkit-scrollbar-thumb { background: #ffc9c9; border-radius: 10px; }
        
        .history-item {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .history-item:hover {
            transform: translateY(-2px);
            border-color: #ffc9c9;
        }

        .history-date {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .history-title {
            font-weight: bold;
            color: #1e293b;
            font-size: 15px;
        }

        .history-score {
            font-size: 18px;
            font-weight: 900;
        }
    </style>
</head>
<body>

<div id="petal-container"></div>

<div id="quiz-screen" class="main-box">
    <div class="health-icon">💪🥗</div>
    <div style="color: var(--dark-color); font-weight: bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;">
