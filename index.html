<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customs and Traditions - Meow Version</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .quiz-container {
            background-color: white;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            width: 420px;
            text-align: center;
            border: 3px solid #ffccd5;
            position: relative;
            z-index: 10;
        }

        .progress-box {
            font-size: 14px;
            color: #ff6b8b;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: right;
        }

        .review-badge {
            background-color: #ffe0e6;
            color: #de3d31;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .word-box {
            font-size: 30px;
            font-weight: bold;
            color: #ff6b8b;
            margin-bottom: 5px;
        }

        .instruction {
            color: #887b7d;
            font-size: 13px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background-color: #fff5f7;
            border: 2px solid #ffe0e6;
            border-radius: 15px;
            padding: 12px 15px;
            font-size: 15px;
            color: #444;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
        }

        .btn-option:hover {
            background-color: #ffe0e6;
            border-color: #ff9eaa;
            transform: translateY(-1px);
        }

        .btn-option.correct {
            background-color: #e8f7f0;
            border-color: #a3e2c1;
            color: #1e7e4e;
            font-weight: bold;
        }

        .btn-option.wrong {
            background-color: #ffebe9;
            border-color: #ffb3ad;
            color: #de3d31;
        }

        .btn-option:disabled {
            pointer-events: none;
        }

        .result-message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }

        .btn-next {
            margin-top: 15px;
            background-color: #ff6b8b;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 107, 139, 0.3);
            display: none;
            transition: all 0.2s;
        }

        .btn-next:hover {
            background-color: #ff4770;
            transform: scale(1.03);
        }

        /* KHU VỰC 2 CHÚ MÈO ĐẦY ĐỦ THÂN HÌNH VUI CHƠI */
        .cats-playground {
            position: absolute;
            bottom: 20px;
            right: 30px;
            width: 180px;
            height: 110px;
            z-index: 1;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .cat-box {
            width: 80px;
            height: 100px;
            transition: transform 0.3s;
        }

        /* Hiệu ứng nhảy vui sướng khi làm đúng */
        @keyframes catBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px) scaleY(0.9); }
        }

        /* Mèo trắng nhảy trước, mèo vàng nhảy sau một chút cho sinh động */
        .bounce-cat1 {
            animation: catBounce 0.5s ease-in-out 2;
        }
        .bounce-cat2 {
            animation: catBounce 0.5s ease-in-out 2 0.15s;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress-box" id="progress-text">Câu 1/54</div>
    <div id="review-status"></div>
    <div class="word-box" id="english-word">Loading...</div>
    <div class="instruction">Chọn nghĩa tiếng Việt đúng nhất:</div>
    
    <div class="options-list" id="options-container"></div>

    <div class="result-message" id="result-text"></div>
    <button class="btn-next" id="next-btn" onclick="nextQuestion()">Tiếp tục thôi câu sau ✨</button>
</div>

<!-- Góc vui chơi của 2 chú mèo vừa đủ thân, đầu, chân, đuôi -->
<div class="cats-playground">
    <!-- Mèo 1: Mèo trắng tai hồng -->
    <div class="cat-box" id="cat-white">
        <svg viewBox="0 0 80 100" width="100%" height="100%">
            <!-- Đuôi -->
            <path d="M 60,80 Q 75,65 70,50 Q 65,40 70,30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <!-- Thân & Chân sau -->
            <ellipse cx="40" cy="70" rx="22" ry="20" fill="#ffffff"/>
            <ellipse cx="25" cy="85" rx="8" ry="6" fill="#f0f0f0"/>
            <ellipse cx="55" cy="85" rx="8" ry="6" fill="#f0f0f0"/>
            <!-- Chân trước -->
            <ellipse cx="33" cy="88" rx="5" ry="7" fill="#ffffff"/>
            <ellipse cx="47" cy="88" rx="5" ry="7" fill="#ffffff"/>
            <!-- Tai -->
            <polygon points="23,45 15,20 35,35" fill="#ffffff" />
            <polygon points="25,42 19,25 32,35" fill="#ffb6c1" />
            <polygon points="57,45 65,20 45,35" fill="#ffffff" />
            <polygon points="55,42 61,25 48,35" fill="#ffb6c1" />
            <!-- Đầu -->
            <ellipse cx="40" cy="48" rx="20" ry="16" fill="#ffffff"/>
            <!-- Mắt -->
            <circle cx="33" cy="46" r="2.5" fill="#4a4a4a"/>
            <circle cx="47" cy="46" r="2.5" fill="#4a4a4a"/>
            <!-- Má hồng -->
            <circle cx="26" cy="51" r="3" fill="#ffccd5" opacity="0.8"/>
            <circle cx="54" cy="51" r="3" fill="#ffccd5" opacity="0.8"/>
            <!-- Mũi & Miệng -->
            <polygon points="40,51 38,49 42,49" fill="#ff8093"/>
            <path d="M 37,53 Q 40,55 40,53 Q 40,55 43,53" fill="none" stroke="#4a4a4a" stroke-width="1"/>
        </svg>
    </div>

    <!-- Mèo 2: Mèo vàng cam năng động -->
    <div class="cat-box" id="cat-orange">
        <svg viewBox="0 0 80 100" width="100%" height="100%">
            <!-- Đuôi -->
            <path d="M 60,80 Q 75,70 73,55 Q 70,45 75,35" fill="none" stroke="#ffb066" stroke-width="6" stroke-linecap="round"/>
            <!-- Thân & Chân sau -->
            <ellipse cx="40" cy="70" rx="22" ry="20" fill="#ffb066"/>
            <ellipse cx="25" cy="85" rx="8" ry="6" fill="#e6954d"/>
            <ellipse cx="55" cy="85" rx="8" ry="6" fill="#e6954d"/>
            <!-- Chân trước -->
            <ellipse cx="33" cy="88" rx="5" ry="7" fill="#ffb066"/>
            <ellipse cx="47" cy="88" rx="5" ry="7" fill="#ffb066"/>
            <!-- Tai -->
            <polygon points="23,45 15,20 35,35" fill="#ffb066" />
            <polygon points="25,42 19,25 32,35" fill="#ff944d" />
            <polygon points="57,45 65,20 45,35" fill="#ffb066" />
            <polygon points="55,42 61,25 48,35" fill="#ff944d" />
            <!-- Đầu -->
            <ellipse cx="40" cy="48" rx="20" ry="16" fill="#ffb066"/>
            <!-- Mắt -->
            <circle cx="33" cy="46" r="2.5" fill="#4a4a4a"/>
            <circle cx="47" cy="46" r="2.5" fill="#4a4a4a"/>
            <!-- Má hồng -->
            <circle cx="26" cy="51" r="3" fill="#ff8093" opacity="0.6"/>
            <circle cx="54" cy="51" r="3" fill="#ff8093" opacity="0.6"/>
            <!-- Mũi & Miệng -->
            <polygon points="40,51 38,49 42,49" fill="#de5d4e"/>
            <path d="M 37,53 Q 40,55 40,53 Q 40,55 43,53" fill="none" stroke="#4a4a4a" stroke-width="1"/>
        </svg>
    </div>
</div>

<script>
    const vocabulary = [
        { word: "Shape (v)", mean: "Định hình / Hình thành" },
        { word: "Unique (adj)", mean: "Độc đáo / Duy nhất" },
        { word: "Pass down (v)", mean: "Truyền lại (cho đời sau)" },
        { word: "Maintain (v)", mean: "Duy trì / Gìn giữ" },
        { word: "Cultural heritage (n)", mean: "Di sản văn hóa" },
        { word: "Roots (n)", mean: "Cội nguồn / Gốc rễ" },
        { word: "Honor (v)", mean: "Tôn kính / Vinh danh" },
        { word: "Ancestor (n)", mean: "Tổ tiên" },
        { word: "Worship (n/v)", mean: "Sự thờ cúng / Thờ cúng" },
        { word: "Pray (v)", mean: "Cầu nguyện" },
        { word: "Altar (n)", mean: "Bàn thờ" },
        { word: "Occasion (n)", mean: "Dịp / Cơ hội" },
        { word: "Good fortune (n)", mean: "Sự may mắn / Vận may" },
        { word: "Festivity (n)", mean: "Các hoạt động lễ hội" },
        { word: "Preserve (v)", mean: "Bảo tồn / Gìn giữ" },
        { word: "Identity (n)", mean: "Bản sắc" },
        { word: "Lunar New Year (n)", mean: "Tết Âm lịch" },
        { word: "Family reunion (n)", mean: "Cuộc đoàn tụ gia đình" },
        { word: "Parade (n)", mean: "Cuộc diễu hành" },
        { word: "Greeting (n)", mean: "Lời chào" },
        { word: "Prosperity (n)", mean: "Sự thịnh vượng / Giàu có" },
        { word: "Serve as (v)", mean: "Đóng vai trò như là" },
        { word: "Symbol (n)", mean: "Biểu tượng" },
        { word: "Red envelope (n)", mean: "Bao lì xì đỏ" },
        { word: "Superstition (n)", mean: "Sự mê tín" },
        { word: "Avoid (v)", mean: "Tránh / Né tránh" },
        { word: "Prevent (v)", mean: "Ngăn chặn" },
        { word: "Milestone (n)", mean: "Cột mốc quan trọng" },
        { word: "Ceremony (n)", mean: "Nghi lễ" },
        { word: "Ritual (n)", mean: "Nghi thức" },
        { word: "Funeral (n)", mean: "Đám tang" },
        { word: "Strict (adj)", mean: "Nghiêm ngặt" },
        { word: "Guideline (n)", mean: "Hướng dẫn / Nguyên tắc" },
        { word: "Influence (v)", mean: "Ảnh hưởng / Tác động" },
        { word: "Social behavior (n)", mean: "Hành vi xã hội" },
        { word: "Integration (n)", mean: "Sự hòa nhập / Tích hợp" },
        { word: "Mix (v)", mean: "Pha trộn / Trộn lẫn" },
        { word: "Widen (v)", mean: "Mở rộng / Nới rộng" },
        { word: "Generation gap (n)", mean: "Khoảng cách thế hệ" },
        { word: "Value (n)", mean: "Giá trị (về mặt văn hóa, đạo đức...)" },
        { word: "Main idea (n)", mean: "Ý chính (của bài đọc)" },
        { word: "Refer to (v)", mean: "Đề cập đến / Thay thế cho từ nào" },
        { word: "Closest in meaning (adj)", mean: "Gần nghĩa nhất" },
        { word: "Character (n)", mean: "Đặc điểm / Tính cách" },
        { word: "Wealth (n)", mean: "Sự giàu có" },
        { word: "Location (n)", mean: "Vị trí / Địa điểm" },
        { word: "Mention (v)", mean: "Nhắc đến / Đề cập" },
        { word: "Fashionable (adj)", mean: "Thời thượng / Hợp thời trang" },
        { word: "Financial problem (n)", mean: "Vấn đề tài chính" },
        { word: "Attitude (n)", mean: "Thái độ (của tác giả)" },
        { word: "Negative (adj)", mean: "Tiêu cực" },
        { word: "Informative (adj)", mean: "Cung cấp nhiều thông tin hữu ích" },
        { word: "Respectful (adj)", mean: "Tôn trọng / Kính trọng" },
        { word: "Bored (adj)", mean: "Nhàm chán / Buồn chán" }
    ];

    vocabulary.sort(() => Math.random() - 0.5);

    let quizData = [];         
    let wrongQuestions = [];   
    let currentQuestionIndex = 0;
    let score = 0;
    let isReviewMode = false;  
    let totalFirstRoundQuestions = vocabulary.length;

    function generateQuizData(targetList) {
        return targetList.map((item) => {
            let options = [item.mean];
            while (options.length < 4) {
                let randomItem = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomItem.mean)) {
                    options.push(randomItem.mean);
                }
            }
            options.sort(() => Math.random() - 0.5);
            return {
                word: item.word,
                mean: item.mean,
                options: options,
                correct: options.indexOf(item.mean)
            };
        });
    }

    const progressElement = document.getElementById("progress-text");
    const reviewStatusElement = document.getElementById("review-status");
    const wordElement = document.getElementById("english-word");
    const optionsContainer = document.getElementById("options-container");
    const resultText = document.getElementById("result-text");
    const nextButton = document.getElementById("next-btn");
    const catWhite = document.getElementById("cat-white");
    const catOrange = document.getElementById("cat-orange");

    function loadQuestion() {
        optionsContainer.innerHTML = "";
        resultText.innerText = "";
        nextButton.style.display = "none";
        
        // Reset hiệu ứng nhảy của 2 bé mèo
        catWhite.classList.remove("bounce-cat1");
        catOrange.classList.remove("bounce-cat2");

        progressElement.innerText = `Câu ${currentQuestionIndex + 1}/${quizData.length}`;

        if (isReviewMode) {
            reviewStatusElement.innerHTML = `<span class="review-badge">Luyện lại câu sai 🔄</span>`;
        } else {
            reviewStatusElement.innerHTML = "";
        }

        const currentQuiz = quizData[currentQuestionIndex];
        wordElement.innerText = currentQuiz.word;

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.classList.add("btn-option");
            button.innerText = option;
            button.onclick = () => checkAnswer(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex, selectedButton) {
        const currentQuiz = quizData[currentQuestionIndex];
        const allButtons = document.querySelectorAll(".btn-option");

        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuiz.correct) {
            selectedButton.classList.add("correct");
            resultText.innerText = "Giỏi quá đúng rồi! 💮";
            resultText.style.color = "#1e7e4e";
            
            // Kích hoạt hiệu ứng nhún nhảy vui vẻ của cả 2 bé mèo
            catWhite.classList.add("bounce-cat1");
            catOrange.classList.add("bounce-cat2");
            
            if (!isReviewMode) score++; 
        } else {
            selectedButton.classList.add("wrong");
            allButtons[currentQuiz.correct].classList.add("correct");
            resultText.innerText = "Sai rồi, hai bé mèo lưu lại để bạn làm lại nhé! 😿";
            resultText.style.color = "#de3d31";

            if (!wrongQuestions.some(item => item.word === currentQuiz.word)) {
                wrongQuestions.push({ word: currentQuiz.word, mean: currentQuiz.mean });
            }
        }

        nextButton.style.display = "inline-block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            if (wrongQuestions.length > 0) {
                isReviewMode = true;
                quizData = generateQuizData(wrongQuestions); 
                wrongQuestions = []; 
                currentQuestionIndex = 0;
                loadQuestion();
            } else {
                optionsContainer.innerHTML = "";
                reviewStatusElement.innerHTML = "";
                progressElement.innerText = "Hoàn thành";
                wordElement.innerText = "Meooww! 🎉";
                resultText.innerText = `Tuyệt vời! Bạn đã thuộc sạch toàn bộ từ vựng!\nĐiểm số vòng đầu: ${score}/${totalFirstRoundQuestions}`;
                resultText.style.color = "#ff6b8b";
                nextButton.style.display = "none";
                
                // Khi hoàn thành bài, 2 mèo nhảy liên tục không ngừng
                catWhite.style.animation = "catBounce 0.5s ease-in-out infinite";
                catOrange.style.animation = "catBounce 0.5s ease-in-out infinite 0.15s";
            }
        }
    }

    quizData = generateQuizData(vocabulary);
    loadQuestion();
</script>

</body>
</html>
