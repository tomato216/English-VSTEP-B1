<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Luyện VSTEP B1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .welcome-container {
            background-color: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4);
            width: 400px;
            text-align: center;
            border: 3px solid #ffccd5;
        }

        h1 {
            color: #ff6b8b;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #887b7d;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-menu {
            background-color: #fff5f7;
            border: 2px solid #ffe0e6;
            border-radius: 18px;
            padding: 15px;
            font-size: 18px;
            color: #444;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-menu:hover {
            background-color: #ff6b8b;
            color: white;
            border-color: #ff4770;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.3);
        }

        .footer-cats {
            margin-top: 25px;
            font-size: 24px;
            animation: bounce 1s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

<div class="welcome-container">
    <h1>VSTEP B1 Prep 🎯</h1>
    <div class="subtitle">Chào mừng bạn đến với không gian ôn luyện từ vựng chuyên sâu. Hãy chọn kỹ năng bạn muốn thử thách hôm nay!</div>
    
    <div class="menu-options">
        <button class="btn-menu" onclick="selectSkill('reading')">📖 Kỹ năng Reading</button>
        <button class="btn-menu" onclick="selectSkill('writing')">✍️ Kỹ năng Writing</button>
    </div>

    <div class="footer-cats">🐱 Luyện tập cùng mèo béo 🐾</div>
</div>

<script>
    // Hàm tạo âm thanh tinh tinh khi bấm nút
    function playSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Nốt cao vui tai
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) { console.log(e); }
    }

    function selectSkill(skill) {
        playSound();
        // Chờ âm thanh phát xong 0.15 giây rồi chuyển trang
        setTimeout(() => {
            if (skill === 'reading') {
                window.location.href = 'reading.html'; // Chuyển sang file đọc
            } else if (skill === 'writing') {
                window.location.href = 'writing.html'; // Chuyển sang file viết (Sẽ tạo sau)
            }
        }, 150);
    }
</script>

</body>
</html>
